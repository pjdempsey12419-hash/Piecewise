let uploadedImageData = null;
function defaultDueDate(daysFromNow) { return new Date(Date.now() + 86400000 * daysFromNow).toISOString().split('T')[0]; }
function parseLines(raw) {
  const lines = raw.split(/\n+/).map(l => l.trim()).filter(l => l.length > 2);
  return (lines.length ? lines : [raw.trim() || 'Untitled problem']).map(l => l.replace(/^\d+[\.\)]\s*/, ''));
}

// Worksheet furniture that shows up in extracted text but is never itself a problem.
function looksLikeWorksheetNoise(line) {
  const l = line.trim();
  if (l.length < 3) return true;
  return [
    /^name\s*:?\s*$/i, /^name\s*:/i, /^date\s*:/i, /^period\s*:/i, /^class(room)?\s*:/i,
    /^(teacher|score|grade|section)\s*:/i, /^page\s+\d+(\s*(of|\/)\s*\d+)?\s*$/i,
    /^instructions?\s*:?\s*$/i, /^directions?\s*:?\s*$/i,
    /^(show|write|circle|box|underline|label)\s+(all\s+)?your\s+(work|answer)/i,
    /^worksheet$/i, /^homework$/i, /^assignment$/i, /^answer\s+key$/i,
    /^\(?\d{1,4}\)?\.?\s*$/,             // a bare number (stray page number, or a leftover answer-blank marker)
    /^[_\-=.\s]{4,}$/,                   // a divider line of dashes/underscores/dots
    /^(https?:\/\/|www\.)\S+$/i,         // a standalone URL (worksheet-site watermark/footer)
  ].some(re => re.test(l));
}

// Matches a line that STARTS a new numbered/lettered problem: "1.", "1)", "(1)", "Q1.",
// "Problem 3:", "#4". Deliberately strict about the start of the line so it won't trigger
// mid-sentence on something like "...in 2. the answer is..." appearing after OCR noise.
const QUESTION_START_RE = /^\(?\s*(?:q(?:uestion)?\.?\s*|problem\.?\s*|#)?(\d{1,3})\s*[\.\):]\s*/i;

// Turns messy extracted document text (OCR output or a PDF's text layer) into a list of
// actual problems, instead of treating every line break as a new problem. Numbered markers
// define question boundaries; everything between one marker and the next  -  including lines
// that merely wrapped  -  is joined back into a single problem. Lines that are clearly page
// furniture (name/date fields, page numbers, "show your work") are dropped rather than turned
// into fake problems. If no numbering is found at all, falls back to blank-line-separated
// paragraphs, which is still far better than one-fake-problem-per-line.
// Breaks apart a single run-on chunk that actually contains several short problems with no
// line breaks or numbering between them  -  e.g. a list of equations ("x+3=2x -3x=-18 4x-3x=12")
// or several repeated sentences ("Evaluate the expression for x = 2. Evaluate ... for a = 5.").
// Cuts right after: (a) an ordinary sentence end (. ! ?) followed by a capital letter or digit,
// or (b) "= <plain number>" (a closed numeric answer)  -  but NOT when that number is actually
// the start of a coefficient like "2x" (checked via a lookahead so "= 2x" is never cut).
// Common abbreviations whose period is never a real sentence end  -  without this guard a
// run-on splitter applied to non-math subjects (history, language, reading) would wrongly
// cut after "Dr.", "U.S.", "e.g.", a single initial like "J.", etc.
const ABBREV_RE = /\b(mr|mrs|ms|dr|prof|st|jr|sr|vs|etc|e\.g|i\.e|a\.m|p\.m|vol|fig|eq|no|dept|ave|blvd|approx|[a-z])$/i;

function splitRunOnBlock(text) {
  const t = (text || '').trim();
  if (!t) return [];
  const BOUNDARY_RE = /=\s*-?\d+(?:\.\d+)?(?![a-zA-Z])\.?|[.!?]+(?=\s+[A-Z0-9])/g;
  const cuts = [];
  let m;
  while ((m = BOUNDARY_RE.exec(t))) {
    const end = m.index + m[0].length;
    const isEquationClose = m[0].includes('=');
    if (!isEquationClose) {
      const wordBefore = t.slice(0, m.index).match(/([A-Za-z]+)$/);
      if (wordBefore && ABBREV_RE.test(wordBefore[1])) continue; // looks like an abbreviation/initial, not a real sentence end
    }
    cuts.push(end);
  }
  if (!cuts.length) return [t];
  const parts = [];
  let start = 0;
  for (const c of cuts) {
    if (c > start) { parts.push(t.slice(start, c).trim()); start = c; }
  }
  if (start < t.length) parts.push(t.slice(start).trim());
  return parts.filter(p => p.length > 1);
}

// Applies splitRunOnBlock only to blocks that are suspiciously long for a single problem and
// contain more than one likely boundary  -  short, already-clean blocks are left untouched.
function refineLongBlocks(blocks) {
  const out = [];
  for (const b of blocks) {
    const boundaryCount = (b.match(/=\s*-?\d+(?:\.\d+)?(?![a-zA-Z])|[.!?]+\s+[A-Z0-9]/g) || []).length;
    if (b.length > 70 && boundaryCount > 1) out.push(...splitRunOnBlock(b));
    else out.push(b);
  }
  return out;
}

function parseExtractedDocument(raw) {
  const rawLines = (raw || '').split(/\r?\n/).map(l => l.trim());
  // If the document uses numbering anywhere, anything before the FIRST marker is a title,
  // name/date field, or instructions  -  never an actual problem  -  so it gets discarded
  // rather than becoming a fake "problem 0". Only keep pre-marker text when there is no
  // numbering anywhere, where it's genuine content for the paragraph fallback below.
  const hasNumbering = rawLines.some(l => l && !looksLikeWorksheetNoise(l) && QUESTION_START_RE.test(l));

  const blocks = [];
  let current = null;
  let sawNumbering = false;
  let emptyMarkerCount = 0;   // markers immediately followed by another marker (just answer-blank numbers)

  for (const line of rawLines) {
    if (!line || looksLikeWorksheetNoise(line)) continue;
    const m = line.match(QUESTION_START_RE);
    if (m) {
      sawNumbering = true;
      if (current !== null) {
        const trimmed = current.trim();
        if (trimmed) blocks.push(trimmed); else emptyMarkerCount++;
      }
      current = line.slice(m[0].length).trim();
    } else if (current !== null) {
      current = (current + ' ' + line).trim();   // a wrapped continuation of the current problem
    } else if (!hasNumbering) {
      current = line;                              // no numbering anywhere -> keep as candidate content
    }
    // else: numbering exists elsewhere but hasn't started yet -> this is header/title text, drop it
  }
  if (current) blocks.push(current.trim()); else if (current === '') emptyMarkerCount++;

  // A string of markers with nothing between them (1. 2. 3. 4. ...) is just a printed list of
  // blank answer lines, not real boundaries  -  if most of the markers we saw were empty like
  // that, the numbering for this document isn't trustworthy, so fall through to the paragraph
  // fallback below instead of trusting whatever got dumped after the last empty marker.
  const numberingIsDegenerate = emptyMarkerCount >= 3 && emptyMarkerCount > blocks.length;

  const cleanOnly = arr => {
    const out = arr.map(b => b.replace(/\s{2,}/g, ' ').trim()).filter(b => b.length > 1 && !looksLikeWorksheetNoise(b));
    return out.length ? out : null;
  };
  // Only used for the fallback paths below, where we have no reliable document numbering to
  // trust  -  never applied to a block that real numbering already bounded correctly, since
  // a naturally longer numbered problem (e.g. one spanning a small system of equations) must
  // not get chopped up just because it happens to contain more than one "=".
  const finalize = arr => cleanOnly(refineLongBlocks(arr));

  if (sawNumbering && !numberingIsDegenerate) {
    const result = cleanOnly(blocks);
    if (result) return result;
  }

  // No numbering detected (or it turned out to be degenerate)  -  fall back to paragraphs:
  // blank-line-separated chunks, each with its own wrapped lines joined into one problem.
  const paragraphs = (raw || '')
    .split(/\n\s*\n+/)
    .map(p => p.replace(/\s+/g, ' ').trim())
    .filter(p => p.length > 8 && !looksLikeWorksheetNoise(p));
  if (paragraphs.length > 1) {
    const result = finalize(paragraphs);
    if (result) return result;
  }

  // Truly just one undifferentiated blob of text (common when OCR loses all line structure)
  // -  still worth trying to split it into separate problems rather than giving up.
  const whole = (raw || '').replace(/\s+/g, ' ').trim();
  if (!whole) return ['Untitled problem'];
  return finalize([whole]) || ['Untitled problem'];
}

function handleFileSelected(file) {
  if (!file) return;
  const titleGuess = file.name.replace(/\.[^.]+$/, '');
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (isImage) {
    const reader = new FileReader();
    reader.onload = evt => { uploadedImageData = evt.target.result; };
    reader.readAsDataURL(file);
    attemptAIRead(file, titleGuess, false);
  } else if (isPdf) {
    attemptAIRead(file, titleGuess, true);
  } else if (file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt')) {
    const reader = new FileReader();
    reader.onload = evt => {
      state.ui.pendingUpload = { source: 'file', kind: 'text', title: titleGuess, subject: 'Other', dueDate: defaultDueDate(3), lines: parseLines(evt.target.result) };
      render();
    };
    reader.readAsText(file);
  } else {
    fallbackToManualEntry(titleGuess, 'Other');
  }
}

function ensurePdfWorker() {
  if (window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}

async function renderPdfPagesToBlobs(file, maxPages) {
  if (!window.pdfjsLib) throw new Error('pdf.js not available');
  ensurePdfWorker();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const numPages = Math.min(pdf.numPages, maxPages);
  const blobs = [];
  for (let i = 1; i <= numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.6 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (blob) blobs.push(blob);
  }
  return blobs;
}

// Pulls the real embedded text layer out of a PDF (no OCR needed) and reassembles
// rough line breaks by watching for jumps in each text run's baseline Y position.
async function extractPdfText(file, maxPages) {
  if (!window.pdfjsLib) throw new Error('pdf.js not available');
  ensurePdfWorker();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const numPages = Math.min(pdf.numPages, maxPages);
  let out = '';
  for (let i = 1; i <= numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lines = [], cur = [], lastY = null;
    content.items.forEach(item => {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2.5) { lines.push(cur.join(' ')); cur = []; }
      cur.push(item.str);
      lastY = y;
    });
    if (cur.length) lines.push(cur.join(' '));
    out += lines.join('\n') + '\n';
  }
  return out;
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (window.Tesseract) { resolve(); return; }
      existing.addEventListener('load', () => resolve());
      existing.addEventListener('error', () => reject(new Error('failed to load ' + src)));
      return;
    }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('failed to load ' + src));
    document.head.appendChild(s);
  });
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(img.src); resolve(img); };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// Grayscale + contrast-stretch (and upscale if small) before handing a photo to OCR.
// Phone photos of worksheets are usually low-contrast and unevenly lit, which is exactly
// what trips up Tesseract; this one pass measurably improves recognition on real photos.
// Local-adaptive ("Bradley") thresholding: each pixel is compared against the average
// brightness of its own neighborhood rather than one global cutoff, computed in O(1) per
// pixel via an integral image. This is the standard fix for what actually trips up OCR on a
// real phone photo  -  an uneven lighting gradient or a shadow across the page  -  which a
// single global contrast stretch cannot correct since one side of the page is genuinely
// brighter than the other.
function adaptiveThreshold(imageData, windowSize, t) {
  const { data, width, height } = imageData;
  const gray = new Float64Array(width * height);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  const iw = width + 1;
  const integral = new Float64Array(iw * (height + 1));
  for (let y = 0; y < height; y++) {
    let rowSum = 0;
    for (let x = 0; x < width; x++) {
      rowSum += gray[y * width + x];
      integral[(y + 1) * iw + (x + 1)] = integral[y * iw + (x + 1)] + rowSum;
    }
  }
  const s2 = windowSize >> 1;
  for (let y = 0; y < height; y++) {
    const y1 = Math.max(0, y - s2), y2 = Math.min(height - 1, y + s2);
    for (let x = 0; x < width; x++) {
      const x1 = Math.max(0, x - s2), x2 = Math.min(width - 1, x + s2);
      const count = (x2 - x1 + 1) * (y2 - y1 + 1);
      const sum = integral[(y2 + 1) * iw + (x2 + 1)] - integral[y1 * iw + (x2 + 1)] - integral[(y2 + 1) * iw + x1] + integral[y1 * iw + x1];
      const p = y * width + x;
      const value = gray[p] * count <= sum * (1 - t) ? 0 : 255;
      const di = p * 4;
      data[di] = data[di + 1] = data[di + 2] = value;
    }
  }
  return imageData;
}

async function preprocessImageForOCR(file) {
  const img = await loadImageFromFile(file);
  // Upscale small photos (helps OCR read small text) and cap huge ones (modern phone photos
  // can be 3000-4000px wide; OCR gains nothing past ~2200px and it just costs time/memory).
  let scale = 1;
  if (img.width < 1400) scale = Math.min(2.2, 1400 / img.width);
  else if (img.width > 2200) scale = 2200 / img.width;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const windowSize = Math.max(15, Math.round(canvas.width / 8));
  adaptiveThreshold(imageData, windowSize, 0.15);
  ctx.putImageData(imageData, 0, 0);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Client-side OCR via Tesseract.js  -  runs entirely in the browser, no server or API key needed.
// Uses the worker API (not the one-shot convenience call) so we can set a page-segmentation
// mode suited to a worksheet: a single column of variably-sized text blocks, read top to bottom.
const OCR_STATUS_LABELS = {
  'loading tesseract core': 'Starting the reader…',
  'initializing tesseract': 'Starting the reader…',
  'loading language traineddata': 'Downloading language data… (first time only)',
  'initializing api': 'Almost ready…',
  'recognizing text': 'Reading your worksheet…',
};

async function extractTextFromImage(file) {
  if (!window.Tesseract) {
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js');
  }
  updateReadingProgress(0.08, 'Cleaning up the photo…');
  let input = file;
  try { input = await preprocessImageForOCR(file); } catch (e) { /* fall back to the raw file if preprocessing fails */ }
  updateReadingProgress(0.18);

  const logger = m => {
    if (!m || typeof m.progress !== 'number') return;
    // Stages before "recognizing text" (model/language download, init) count for ~20% of the
    // bar; the actual OCR pass fills the rest, so the bar moves the whole time, not just at the end.
    const base = m.status === 'recognizing text' ? 0.2 : 0;
    const span = m.status === 'recognizing text' ? 0.8 : 0.2;
    updateReadingProgress(base + m.progress * span, OCR_STATUS_LABELS[m.status]);
  };

  if (window.Tesseract.createWorker) {
    const worker = await window.Tesseract.createWorker('eng', 1, { logger });
    try {
      // Default (fully-automatic) page segmentation. Worksheets commonly have a numbered
      // answer-blank column beside the actual problem text, which a forced single-column
      // mode would badly scramble  -  automatic layout detection handles that far better.
      const { data } = await worker.recognize(input);
      return (data && data.text) || '';
    } finally {
      await worker.terminate();
    }
  }
  const result = await window.Tesseract.recognize(input, 'eng', { logger });
  return (result && result.data && result.data.text) || '';
}

// Reads a worksheet file into a list of problem lines. If this page is running inside
// a Claude Artifact with image-sampling granted, that AI reader is tried first since it
// understands problem boundaries semantically. Everywhere else (a plain saved HTML file,
// any regular browser) it falls back to real local extraction: pdf.js's text layer for
// PDFs, and in-browser OCR (Tesseract.js) for photos/scans  -  fully offline-capable logic,
// no account or API key required.
async function attemptAIRead(file, titleGuess, isPdf) {
  showReadingOverlay();

  let sample = null;
  try { sample = window.claude ? await window.claude.use('sample') : null; } catch (e) {}
  if (sample) {
    let caps = null;
    try { caps = await sample.limits(); } catch (e) {}
    if (caps && caps.images) {
      try {
        const imageBlobs = isPdf ? await renderPdfPagesToBlobs(file, Math.max(1, Math.min(caps.images.maxCount, 5))) : [file];
        if (imageBlobs && imageBlobs.length) {
          const data = await sample.json(
            'This image shows a student worksheet or homework page (there may be several pages, given in order). ' +
            'Read every distinct problem or question exactly as written on it, including numbers, labels, and instructions, one per array item, in the order they appear. ' +
            'Skip headers, names, and page furniture that are not actual problems. ' +
            'Reply with ONLY a JSON array of strings, nothing else. Example: ["1) Solve for x: 2x + 5 = 17", "2) Simplify (x+3)(x-3)"]. If you cannot find any readable problems, reply with [].',
            { images: imageBlobs, modelTier: 'default', cache: false }
          );
          const lines = Array.isArray(data) ? data.map(x => String(x).trim()).filter(Boolean) : [];
          if (lines.length) {
            hideReadingOverlay();
            state.ui.pendingUpload = { source: 'file', kind: 'text', title: titleGuess, subject: 'Other', dueDate: defaultDueDate(4), lines, aiRead: true };
            render();
            return;
          }
        }
      } catch (e) { /* fall through to local extraction below */ }
    }
  }

  try {
    const rawText = isPdf ? await extractPdfText(file, 8) : await extractTextFromImage(file);
    hideReadingOverlay();
    const lines = parseExtractedDocument(rawText || '');
    if (!rawText || !rawText.trim() || lines.length === 0) {
      fallbackToManualEntry(titleGuess, isPdf ? 'Other' : 'Math', true);
      toast("Couldn't find readable text in that file  -  fill it in manually.");
      return;
    }
    state.ui.pendingUpload = { source: 'file', kind: 'text', title: titleGuess, subject: 'Other', dueDate: defaultDueDate(4), lines, aiRead: true };
    render();
  } catch (e) {
    hideReadingOverlay();
    fallbackToManualEntry(titleGuess, isPdf ? 'Other' : 'Math', true);
    toast("Couldn't read that automatically  -  fill it in manually.");
  }
}

  const interval = setInterval(() => {

    if (i >= 100) { i = 100; paint(100); clearInterval(interval); setTimeout(() => { root.innerHTML = ''; onDone(); }, 350); }
    else paint(i);
  }, 140);
}

function renderWorkTab() {
  const ui = state.ui;
  if (ui.workPlayer && !workPlayerTargetExists(ui.workPlayer)) ui.workPlayer = null;
  if (ui.workPlayer) return renderWorkPlayer();
  if (ui.workView === 'detail' && ui.workAssignmentId) {
    const ass = getAssignment(ui.workAssignmentId);

  }

}
// Guards against a stale workPlayer pointer (e.g. its assignment/problem/step was deleted elsewhere).
function workPlayerTargetExists(wp) {
  const ass = getAssignment(wp.assignmentId);
  if (!ass) return false;
  const p = getProblem(ass, wp.problemId);
  if (!p) return false;
  return !!getStep(p, wp.stepId);
}

/* ============================== LIBRARY ==============================
   The Work tab's list view, built to the design reference: a search field,
   a row of subject chips and one card per assignment. Filter state lives in
   state.ui, so it is scoped to the session rather than persisted  -  a
   half-typed search should not greet you tomorrow.

function libraryIsFiltered() {
  return !!(state.ui.librarySearch || '').trim()
      || (state.ui.librarySubject || 'All') !== 'All'
      || !!state.ui.libraryHideDone;
}

function libraryFilteredAssignments() {
  const q = (state.ui.librarySearch || '').trim().toLowerCase();
  const subject = state.ui.librarySubject || 'All';
  return state.assignments.filter(ass => {
    if (subject !== 'All' && (ass.subject || 'Other') !== subject) return false;
    if (state.ui.libraryHideDone) {
      const st = getAssignmentStats(ass);
      if (st.total > 0 && st.completed === st.total) return false;
    }
    if (!q) return true;
    return `${ass.title || ''} ${ass.subject || ''}`.toLowerCase().includes(q);
  });
}

// Rows only  -  kept separate from the screen so typing can repaint the list
// without replacing the search field and losing focus mid-word.
function libraryRowsHTML() {
  const rows = libraryFilteredAssignments();
  if (rows.length === 0) {
    const filtered = libraryIsFiltered();
    return `<div class="p-8 text-center bg-surface border border-line rounded-xl space-y-2 enter">
      <p class="text-xs text-ink2">${filtered ? 'No assignments match those filters.' : 'No assignments yet.'}</p>

// The live question is the one in the session queue, since a generated card does
// not exist anywhere else  -  its numbers were minted for this attempt.
/* Resolve by INSTANCE id first, falling back to the skill. A session can hold the
   same skill twice with different numbers, and answer order is shuffled per
   instance, so matching on the skill alone would grade the second showing against
   the first one's correct slot. */
function queuedCard(deckId, cardId, skillId) {
  const q = currentQueue();
  return q.find(c => c.deckId === deckId && c.id === cardId)
      || q.find(c => c.deckId === deckId && c.skillId === (skillId || cardId));
}

function completeStudyCard(deckId, skillId, selectedIndex, cardId) {
  if (!state.studyProgress[deckId]) state.studyProgress[deckId] = {};
  const live = queuedCard(deckId, cardId || skillId, skillId);
  const fallback = getDeck(deckId)?.cards?.find(c => c.id === skillId);
  const correct = (live || fallback)?.correctIndex === selectedIndex;
  // Keep the running history, not just the last answer: the mix needs to know how
  // often a skill has been missed and whether it has since been shored up.
  // Progress keys on the SKILL, not the instance: "still shaky on systems of
  // equations" is the fact worth keeping, and it has to survive the question
  // itself being different numbers every time.
  const prev = state.studyProgress[deckId][skillId] || {};
  state.studyProgress[deckId][skillId] = {
    selectedIndex, correct, completedAt: todayStr(),
    attempts: (prev.attempts || 0) + 1,
    wrong: (prev.wrong || 0) + (correct ? 0 : 1),
    streak: correct ? (prev.streak || 0) + 1 : 0,
    lastWrongAt: correct ? (prev.lastWrongAt || null) : todayStr(),
  };
  recordSessionResult(deckId, skillId, correct, true);
  const hitGoal = recordStudyCard();
  markActivity(); saveState();
  if (hitGoal) showGoalOverlay();
  else if (correct) burstConfetti();
}
function completeFreeStudyCard(deckId, skillId, text) {
  if (!state.studyProgress[deckId]) state.studyProgress[deckId] = {};
  const prev = state.studyProgress[deckId][skillId] || {};
  state.studyProgress[deckId][skillId] = {
    response: text, completedAt: todayStr(),
    attempts: (prev.attempts || 0) + 1, wrong: prev.wrong || 0, streak: (prev.streak || 0) + 1,
  };
  recordSessionResult(deckId, skillId, true, false);
  const hitGoal = recordStudyCard();
  markActivity(); saveState();
  if (hitGoal) showGoalOverlay(); else burstConfetti();
}

/* ============================== QUESTION GENERATOR ==========================
   A deck is a set of SKILLS, not a fixed list of questions. A skill is either a
   static card or a template that mints a fresh question from a seed, so a deck
   never runs out and never repeats the same numbers twice in a row.

   Progress is tracked per skill rather than per generated instance: "still shaky
   on systems of equations" is the useful fact, and it survives the question
   itself being different every time. Static cards use their own id as the skill
   id, so progress recorded before any of this still lines up.
   ========================================================================== */

// Small deterministic PRNG: same seed, same question, which keeps a card stable
// while it is on screen and lets a specific question be reproduced.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed);
  const api = {
    next: () => r(),
    int: (lo, hi) => lo + Math.floor(r() * (hi - lo + 1)),
    pick: arr => arr[Math.floor(r() * arr.length)],
    shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    // Distinct distractors around a correct value, for numeric questions.
    nearMisses: (correct, n, spread) => {
      const out = new Set();
      let guard = 60;
      while (out.size < n && guard-- > 0) {
        const d = api.int(1, spread || Math.max(3, Math.abs(Math.round(correct * 0.3)) || 5));
        const v = api.next() < 0.5 ? correct - d : correct + d;
        if (v !== correct) out.add(v);
      }
      let pad = correct + 1;
      while (out.size < n) { if (pad !== correct) out.add(pad); pad++; }
      return [...out].slice(0, n);
    },
  };
  return api;
}

// Every skill in a deck: templates plus any static cards it still carries.
function deckSkills(deck) {
  const fromTemplates = (deck.templates || []).map(t => ({ skillId: t.id, deck, template: t, label: t.skill }));
  const fromCards = (deck.cards || []).map(c => ({ skillId: c.id, deck, staticCard: c, label: c.skill || null }));
  return fromTemplates.concat(fromCards);
}
function findSkill(deckId, skillId) {
  const deck = getDeck(deckId);
  return deck ? deckSkills(deck).find(s => s.skillId === skillId) : null;
}

/* Turn a skill into an actual question. Answer order is shuffled per instance so
   a template's correct answer doesn't settle into the same slot every time. */
/* Some parameter draws collapse a distractor onto the right answer  -  a radius
   where 2&pi;r equals &pi;r&#178;, a pH of 7 where 14 &minus; pH is pH again. Rather than
   guarding every template by hand, reject the instance and redraw: a different
   seed means different numbers, and a template that is fine in general recovers
   immediately. This also stops a future template from shipping a duplicate. */
function specIsValid(spec) {
  if (!spec || !spec.q || !spec.explain) return false;
  if (spec.kind === 'free') return true;
  if (!Array.isArray(spec.options) || spec.options.length !== 4) return false;
  if (spec.correctIndex < 0 || spec.correctIndex > 3) return false;
  const asText = spec.options.map(o => String(o == null ? '' : o).trim());
  if (asText.some(o => o === '')) return false;
  if (new Set(asText).size !== 4) return false;
  if (/undefined|NaN|\[object/.test(spec.q + asText.join('') + spec.explain)) return false;
  return true;
}

function materializeCard(skill, seed) {
  if (skill.staticCard) {
    return Object.assign({}, skill.staticCard, {
      deckId: skill.deck.id, skillId: skill.skillId, id: skill.skillId,
    });
  }
  let useSeed = seed >>> 0, spec = null;
  for (let attempt = 0; attempt < 24; attempt++) {
    const candidate = useSeed + attempt * 0x9E3779B1;
    let got = null;
    try { got = skill.template.gen(makeRng(candidate >>> 0)); } catch (e) { got = null; }
    if (specIsValid(got)) { spec = got; useSeed = candidate >>> 0; break; }
  }
  if (!spec) return null;    // template is broken for every draw; drop the slot

  const base = {
    deckId: skill.deck.id, skillId: skill.skillId,
    id: `${skill.skillId}#${useSeed}`,
    skill: skill.template.skill,
    q: spec.q, explain: spec.explain,
  };
  if (spec.kind === 'free') return Object.assign(base, { kind: 'free' });
  const correctValue = spec.options[spec.correctIndex];
  const options = makeRng(useSeed ^ 0x5bf03635).shuffle(spec.options);
  return Object.assign(base, { options, correctIndex: options.indexOf(correctValue) });
}
function generateCard(deckId, skillId, seed) {
  const skill = findSkill(deckId, skillId);
  return skill ? materializeCard(skill, seed === undefined ? (Math.random() * 1e9) | 0 : seed) : null;
}

/* ============================== WEAKNESS MODEL ==============================
   Every answer is recorded per card, so "weak" is something measured rather than
   declared: a card you have missed and not yet got right twice in a row is still
   owed, and a topic's accuracy is just its cards' answers added up. The mix leans
   on those numbers without ever letting one topic take the whole session.

   Correctness alone is not enough, though. A skill answered right three weeks ago
   and one answered right this morning look identical to isShaky(), so without a
   time dimension nothing ever actually comes back. Each skill therefore also sits
   on a widening review ladder, and "due today" is a date comparison the session
   builders consult alongside the weakness pools.
   ========================================================================== */
const MASTERY_STREAK = 2;    // right this many times running before a card is settled
function cardStat(deckId, skillId) {
  const r = state.studyProgress[deckId]?.[skillId];
  return { attempts: r?.attempts || 0, wrong: r?.wrong || 0, streak: r?.streak || 0, seen: !!r };
}
// Skills you have missed and not yet shored up. These lead the mix.
function isShaky(deckId, skillId) {
  const s = cardStat(deckId, skillId);
  return s.wrong > 0 && s.streak < MASTERY_STREAK;
}
function deckStats(deck) {
  let attempts = 0, wrong = 0, seen = 0, shaky = 0;
  const skills = deckSkills(deck);
  skills.forEach(sk => {
    const s = cardStat(deck.id, sk.skillId);
    attempts += s.attempts; wrong += s.wrong;
    if (s.seen) seen++;
    if (isShaky(deck.id, sk.skillId)) shaky++;
  });
  return {
    deck, attempts, wrong, seen, shaky,
    total: skills.length,
    generated: (deck.templates || []).length > 0,
    accuracy: attempts ? (attempts - wrong) / attempts : null,  // null = untested
  };
}
function examTopics(examKey) {
  return STUDY_DECKS.filter(d => d.exam === examKey).map(deckStats);
}
// Weakest first; topics you have never touched sit in the middle rather than the
// top, so the mix doesn't ignore a genuinely weak topic in favour of a new one.
function weakestTopics(examKey) {
  return examTopics(examKey)
    .filter(t => t.attempts > 0)
    .sort((a, b) => a.accuracy - b.accuracy);
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Pick an index from `weights` proportionally.
function weightedPick(weights) {
  const total = weights.reduce((s, w) => s + w, 0);
  if (total <= 0) return Math.floor(Math.random() * weights.length);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length - 1;
}

/* Builds a session that leans into weak spots while staying varied.

   Roughly half the queue is cards you have actually missed, a third is material
   you have never seen, and the rest is revision. Within the unseen and revision
   pools, topics are sampled by weakness, so a shaky topic comes up more often
   without ever being the only thing you see. A per-topic cap keeps one weak
   topic from swallowing the session. */
/* A single-topic session: same weighting idea, one deck. Templated decks mint a
   goal-sized run; a deck of static cards still plays through in order. */
function buildDeckQueue(deck, size) {
  const skills = deckSkills(deck);
  const templated = (deck.templates || []).length > 0;
  if (!templated) return skills.map(sk => materializeCard(sk, 0));

  const n = Math.max(5, size || sessionSize());
  const shaky = shuffled(skills.filter(sk => isShaky(deck.id, sk.skillId)));
  const unseen = shuffled(skills.filter(sk => !cardStat(deck.id, sk.skillId).seen));
  const rest = shuffled(skills.filter(sk => !shaky.includes(sk) && !unseen.includes(sk)));
  const picked = [];
  const take = (pool, upTo) => pool.forEach(sk => { if (picked.length < upTo && !picked.includes(sk)) picked.push(sk); });
  take(shaky, Math.ceil(n * 0.5));
  take(unseen, Math.ceil(n * 0.85));
  take(rest, n);
  take(shaky, n); take(unseen, n);
  // Templates can repeat within a run with different numbers once skills run out.
  // This is also what keeps an endless run going once the skills are exhausted.
  while (picked.length < n && skills.length) picked.push(skills[picked.length % skills.length]);
  return shuffled(picked).map(sk => materializeCard(sk, (Math.random() * 1e9) | 0));
}

function buildMixedQueue(examKey, size) {
  const n = Math.max(5, size || sessionSize());
  const topics = examTopics(examKey);
  if (!topics.length) return [];

  const pools = { shaky: [], unseen: [], review: [] };
  topics.forEach(t => deckSkills(t.deck).forEach(sk => {
    const ref = { deckId: t.deck.id, skillId: sk.skillId };
    if (isShaky(t.deck.id, sk.skillId)) pools.shaky.push(ref);
    else if (!cardStat(t.deck.id, sk.skillId).seen) pools.unseen.push(ref);
    else pools.review.push(ref);
  }));

  // Weakness weight per topic: lower accuracy pulls harder, untested sits mid.
  const weightFor = {};
  topics.forEach(t => { weightFor[t.deck.id] = t.accuracy === null ? 0.5 : (1 - t.accuracy) + 0.15; });

  const perTopicCap = Math.max(2, Math.ceil(n * 0.6));
  const takenFrom = {};
  const out = [];
  const push = ref => {
    if (out.length >= n) return false;
    if ((takenFrom[ref.deckId] || 0) >= perTopicCap) return false;
    if (out.some(o => o.deckId === ref.deckId && o.skillId === ref.skillId)) return false;
    takenFrom[ref.deckId] = (takenFrom[ref.deckId] || 0) + 1;
    out.push(ref);
    return true;
  };

  // Shaky cards first, weakest topics leading, so the session is built around them.
  shuffled(pools.shaky)
    .sort((a, b) => weightFor[b.deckId] - weightFor[a.deckId])
    .slice(0, Math.ceil(n * 0.5))
    .forEach(push);

  // Then fill from the other pools, sampling topics by weakness for variety.
  const fill = (pool, target) => {
    const byTopic = {};
    pool.forEach(r => (byTopic[r.deckId] = byTopic[r.deckId] || []).push(r));
    Object.keys(byTopic).forEach(k => { byTopic[k] = shuffled(byTopic[k]); });
    let guard = pool.length + 8;
    while (out.length < target && guard-- > 0) {
      const keys = Object.keys(byTopic).filter(k => byTopic[k].length);
      if (!keys.length) break;
      const k = keys[weightedPick(keys.map(key => weightFor[key] || 0.2))];
      const ref = byTopic[k].pop();
      if (!push(ref) && out.length >= n) break;
    }
  };
  fill(pools.unseen, Math.min(n, out.length + Math.ceil(n * 0.35)));
  fill(pools.review, n);
  fill(pools.unseen, n);          // second pass in case review ran dry
  fill(pools.shaky, n);           // and finally let shaky cards top it up

  // Interleave so it never reads as "all your mistakes, then everything else",
  // then mint an actual question for each slot.
  return shuffled(out).map(ref => generateCard(ref.deckId, ref.skillId)).filter(Boolean);
}

function examProgress(examKey) {
  const decks = STUDY_DECKS.filter(d => d.exam === examKey);
  let total = 0, done = 0;
  decks.forEach(d => deckSkills(d).forEach(sk => { total++; if (isCardDone(d.id, sk.skillId)) done++; }));
  return { total, done, decks: decks.length };
}

/* A session is a queue of {deckId, cardId}, which is what lets a mixed run cross
   topics. A single-topic run is just the queue that happens to hold one deck. */
function startSession(queue, meta) {
  state.ui.studyQueue = queue;
  state.ui.studyMeta = meta;
  state.ui.studyCardIndex = 0;
  state.ui.studyDeckId = meta.deckId || '__mixed__';
  state.ui.studyResults = [];
  state.ui.studyEnded = false;
}
function currentQueue() { return state.ui.studyQueue || []; }

/* An endless run is a normal session that tops itself up. Nothing about a card
   changes  -  the queue just grows by another batch whenever you reach the end of
   it, built by the same weakness-weighted logic as a fixed set, so an hour of
   endless practice still leans on what you keep missing. Returns false only when
   there is genuinely nothing to generate, which ends the run rather than hanging. */
function extendSession(by) {
  const meta = state.ui.studyMeta || {};
  const n = Math.max(1, by || ENDLESS_BATCH);
  const deck = meta.deckId ? getDeck(meta.deckId) : null;
  let batch = deck ? buildDeckQueue(deck, n) : buildMixedQueue(meta.examKey, n);
  batch = (batch || []).filter(Boolean);
  if (!batch.length) return false;
  // A deck of static cards hands back the same cards in the same order every
  // time, so shuffle and re-key each instance: without a distinct id the second
  // showing would inherit the first one's answer and render as already done.
  const base = currentQueue().length;
  batch = shuffled(batch).map((c, i) => Object.assign({}, c, { id: `${c.id}@${base + i}` }));
  state.ui.studyQueue = currentQueue().concat(batch);
  return true;
}

// One row per card actually answered in this session. The queue can't stand in
// for this: an endless run serves the same skill more than once with different
// numbers, and progress keys on the skill, so the queue alone can't tell a
// repeat from a first attempt.
function recordSessionResult(deckId, skillId, correct, graded) {
  if (!state.ui.studyDeckId) return;
  if (!state.ui.studyResults) state.ui.studyResults = [];
  state.ui.studyResults.push({ deckId, skillId, correct: !!correct, graded: graded !== false });
}

function renderStudySession() {
  const meta = state.ui.studyMeta || {};
  if (!currentQueue().length) { state.ui.studyDeckId = null; return renderStudyTab(); }
  if (state.ui.studyEnded) return renderStudySummary();

  const idx = state.ui.studyCardIndex;
  const fixedLength = currentQueue().length;
  // An endless run tops itself up as you reach the end of the queue, so the only
  // thing that finishes a session is you deciding to stop.
  if (meta.endless && idx >= fixedLength - 1) extendSession();
  if (idx >= currentQueue().length) return renderStudySummary();

  const card = currentQueue()[idx];
  const deck = getDeck(card.deckId);
  const deckId = card.deckId, skillId = card.skillId;
  const goal = state.dailyGoal || 10, done = studiedToday();
  const pct = Math.min(100, Math.round((done / goal) * 100));

  return `<div class="p-4 space-y-3">
    <div class="flex items-center justify-between gap-2">
      <button data-action="exit-deck" class="flex items-center gap-1.5 text-xs font-bold text-ink2 min-w-0">${icon('arrowLeft','w-4 h-4 shrink-0')} <span class="truncate">${escapeHtml(meta.label || deck.exam)}</span></button>
      ${meta.endless ? `<button data-action="end-session" class="shrink-0 px-2.5 py-1.5 rounded-lg bg-surface2 border border-line text-[11px] font-bold text-ink2">Finish</button>` : ''}
    </div>
    ${meta.endless ? `
      <div class="flex items-center gap-2">
        <span class="text-[10px] text-ink3 shrink-0">Today</span>
        <div class="flex-1 h-1.5 bg-surface2 rounded-full overflow-hidden">
          <div class="h-full ${goalMetToday() ? 'bg-good' : 'bg-accent-500'}" style="width:${pct}%"></div>
        </div>
        <span class="text-[10px] font-bold text-ink shrink-0">${done}/${goal}</span>
      </div>` : ''}
    ${isShaky(deckId, skillId) ? `
      <div class="flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg" style="background:rgb(var(--c-peach-100));color:rgb(var(--c-peach-700))">
        ${icon('target','w-3.5 h-3.5')} You missed this one before
      </div>` : ''}
    ${studyCardHTML(deck, card,
        meta.endless ? `Card ${idx + 1}` : `Card ${idx + 1} of ${fixedLength}`,
        'study-session-next', idx)}
  </div>`;
}

/* Reads the session's own answer log rather than the queue. An endless run can
   serve the same skill more than once with different numbers, and progress keys on
   the skill, so counting the queue would collapse those repeats into one. */
function renderStudySummary() {
  const meta = state.ui.studyMeta || {};
  const results = state.ui.studyResults || [];
  const correct = results.filter(r => r.graded && r.correct).length;
  const graded = results.filter(r => r.graded).length;

  // Per-topic breakdown, which is the part that tells you where to go next.
  const byTopic = {};
  results.forEach(r => {
    const t = byTopic[r.deckId] || (byTopic[r.deckId] = { title: getDeck(r.deckId)?.title || r.deckId, n: 0, ok: 0 });
    t.n++; if (r.correct) t.ok++;
  });
  const rows = Object.entries(byTopic).map(([deckId, t]) => {
    const pct = t.n ? Math.round((t.ok / t.n) * 100) : 0;
    return `<div class="flex items-center gap-2.5 text-[11.5px]">
      <span class="flex-1 min-w-0 truncate text-ink2 text-left">${escapeHtml(t.title)}</span>
      <div class="w-20 h-1.5 bg-surface2 rounded-full overflow-hidden shrink-0">
        <div class="h-full ${pct >= 70 ? 'bg-good' : 'bg-accent-500'}" style="width:${pct}%"></div>
      </div>
      <span class="font-bold text-ink w-10 text-right shrink-0">${t.ok}/${t.n}</span>
    </div>`;
  }).join('');

  // Count distinct skills, not answers: missing the same skill twice in an endless
  // run is one thing left to nail, not two.
  const shakyKeys = new Set();
  results.forEach(r => { if (isShaky(r.deckId, r.skillId)) shakyKeys.add(`${r.deckId}|${r.skillId}`); });
  const stillShaky = shakyKeys.size;

  if (!results.length) {
    return `<div class="p-4 space-y-4">
      <div class="p-6 text-center bg-surface border border-line rounded-2xl space-y-3 enter">
        ${mascotBadgeHTML('w-14 h-14')}
        <h3 class="text-base font-display font-semibold text-ink tracking-tight">Nothing answered yet</h3>
        <p class="text-xs text-ink2">Start a set whenever you have a couple of minutes.</p>
        <div class="flex items-center justify-center gap-2 pt-1">
          <button data-action="exit-deck" class="px-3.5 py-2 rounded-xl bg-surface2 text-ink text-xs font-bold">Back</button>
        </div>
      </div>
    </div>`;
  }

  const goal = state.dailyGoal || 10, doneToday = studiedToday();
  return `<div class="p-4 space-y-4">
    <div class="p-6 text-center bg-surface border border-line rounded-2xl space-y-3 enter">
      ${mascotBadgeHTML('w-14 h-14')}
      <h3 class="text-base font-display font-semibold text-ink tracking-tight">${escapeHtml(meta.label || 'Session')} complete</h3>
      <p class="text-3xl font-display font-semibold text-ink">${correct}<span class="text-ink3 text-lg">/${graded || results.length}</span></p>
      <p class="text-xs text-ink2">${results.length} card${results.length === 1 ? '' : 's'} this set &middot; ${
        stillShaky ? `${stillShaky} still to nail` : 'nothing outstanding'
      }</p>
      <p class="text-[11px] text-ink3">${
        goalMetToday() ? `Today's goal is done  -  ${doneToday}/${goal}.`
                       : `${Math.max(0, goal - doneToday)} more today to hit your goal of ${goal}.`
      }</p>
      ${rows ? `<div class="space-y-2 pt-2 text-left">${rows}</div>` : ''}
      <div class="space-y-2 pt-2">
        <button data-action="continue-endless" class="w-full py-2.5 rounded-lg grad-btn text-xs flex items-center justify-center gap-1.5">
          ${icon('infinity','w-4 h-4')} Keep going
        </button>
        <div class="flex items-center gap-2">
          <button data-action="exit-deck" class="flex-1 py-2 rounded-xl bg-surface2 border border-line text-ink text-xs font-bold">Done</button>
          ${meta.examKey ? `<button data-action="start-mixed" data-exam="${escapeHtml(meta.examKey)}" class="flex-1 py-2 rounded-xl bg-surface border border-line text-ink text-xs font-bold">Another mix</button>` : ''}
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================== TAB: CALENDAR ============================== */
function renderCalendarTab() {
  const today = new Date();
  const dayLabels = ['S','M','T','W','T','F','S'];
  let grid = dayLabels.map(d => `<div class="text-center text-[9.5px] font-bold text-ink3 pb-1">${d}</div>`).join('');

  const dueMap = {};
  state.assignments.forEach(a => { dueMap[a.dueDate] = (dueMap[a.dueDate] || []).concat(a); });

  for (let i = 0; i < 14; i++) {
    const d = new Date(); d.setDate(today.getDate() + i);
    const iso = d.toISOString().split('T')[0];
    const isToday = i === 0;
    const dueHere = dueMap[iso];
    grid += `
      <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-xs font-bold border relative ${isToday ? 'bg-ink text-bg border-ink' : 'bg-surface border-line text-ink2'}">
        <span>${d.getDate()}</span>
        ${dueHere ? `<span class="absolute bottom-1 w-1.5 h-1.5 rounded-full ${isToday ? 'bg-bg' : 'bg-accent-500'}"></span>` : ''}
      </div>`;
  }

  const upcoming = [...state.assignments].sort((a,b)=> new Date(a.dueDate)-new Date(b.dueDate)).map(a => {
    const stats = getAssignmentStats(a);
    const daysLeft = daysUntil(a.dueDate);
    const pace = stats.remaining > 0 ? Math.ceil(stats.remaining / daysLeft) : 0;
    const done = stats.remaining === 0;
    return `<div class="p-3 rounded-xl bg-surface border border-line flex items-center justify-between text-xs gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        ${subjectChipHTML(a.subject, 'sm')}
        <div class="min-w-0"><div class="font-bold text-ink truncate">${escapeHtml(a.title)}</div><div class="text-[10.5px] text-ink3">Due ${fmtDate(a.dueDate)} &middot; ${daysLeft}d left</div></div>
      </div>
      <span class="text-[10px] font-bold px-2 py-0.5 rounded border shrink-0 ${done ? 'text-good bg-good/10 border-good/25' : 'text-ink2 bg-surface2 border-line'}">${done ? 'Done' : pace + '/day'}</span>
    </div>`;
  }).join('') || `<div class="text-xs text-ink3">No scheduled assignments.</div>`;

  return `<div class="p-4 space-y-4">
    ${sectionRuleHTML('Schedule', 'Remaining steps are spread evenly across the days before each due date.')}
    <div class="grid grid-cols-7 gap-1.5 p-3 rounded-xl bg-surface border border-line">${grid}</div>
    <div class="space-y-2"><h3 class="text-xs font-bold text-ink2 uppercase tracking-wider">Upcoming</h3><div class="space-y-2">${upcoming}</div></div>
  </div>`;
}

function buildSheetText(ass) {
  let out = `${ass.title}\n${ass.subject || 'Assignment'}  -  ${new Date().toLocaleDateString()}\n\n`;
  ass.problems.forEach((p, i) => {
    const exprText = p.expr && p.expr.trim() ? p.expr.replace(/<[^>]+>/g,'') : `Problem ${i+1} (not added yet)`;
    out += `${i+1}. ${exprText}\n`;
    p.steps.forEach(s => {
      const ans = s.completed ? (s.kind==='mcq' ? s.options[s.selectedIndex].replace(/<[^>]+>/g,'') : (s.response||'Done')) : 'Unanswered';
      const grade = s.selfGrade === 'correct' ? ' [correct]' : s.selfGrade === 'incorrect' ? ' [missed]' : '';
      out += `   ${s.title}: ${ans}${grade}\n`;
    });
    out += '\n';
  });
  return out;
}

async function shareSheet(assId) {
  const ass = getAssignment(assId);
  const text = buildSheetText(ass);
  if (!navigator.share) return;
  try { await navigator.share({ title: ass.title, text }); }
  catch (e) { /* user cancelled the native share sheet  -  not an error */ }
}

// The palette is a set of CSS variables keyed off <html data-theme>, so switching
// themes is a single attribute write  -  nothing re-renders.
function resolvedTheme() {
  const mode = state.theme || 'system';
  if (mode === 'system') return darkQuery.matches ? 'dark' : 'light';
  return mode;
}
function applyTheme() {
  const theme = resolvedTheme();
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#1A1A1C' : '#FAF9F6');
}
function setTheme(mode) {
  state.theme = mode;
  state.themeChosen = true;
  applyTheme();
  saveState();
  openSettingsSheet();
}

function exportAllData() {
  const { ui, ...persist } = state;
  const blob = new Blob([JSON.stringify(persist, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `piecewise-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Backup downloaded');
}

function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (!data || !Array.isArray(data.assignments)) throw new Error('bad shape');
      state.assignments = data.assignments;
      state.studyProgress = data.studyProgress || {};
      state.streakDays = data.streakDays || 0;
      state.lastActiveDate = data.lastActiveDate || null;
      saveState();
      openSettingsSheet();
      toast('Backup imported');
    } catch (e) {
      toast("That file doesn't look like a Piecewise backup");
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  state.assignments = [];
  state.studyProgress = {};
  state.streakDays = 0;
  state.lastActiveDate = null;
  state.ui.confirmClearData = false;
  state.ui.workPlayer = null; state.ui.workView = 'list'; state.ui.workAssignmentId = null;
  try { localStorage.removeItem('piecewise_v2'); } catch (e) {}

  toast('All data cleared');
}

function bindDynamicHandlers() {
  const input = document.getElementById('file-input');
  if (input) input.onchange = e => handleFileSelected(e.target.files[0]);
  const dz = document.getElementById('dropzone');
  if (dz) dz.addEventListener('click', () => document.getElementById('file-input').click());
  const raw = document.getElementById('raw-text-input');
  if (raw) raw.oninput = () => { state.ui.draftText = raw.value; };
  const scopeSel = document.getElementById('feed-scope-select');
  if (scopeSel) scopeSel.onchange = () => { state.ui.feedScope = scopeSel.value; state.ui.feedFocusKey = null; render(); };
  const libSearch = document.getElementById('library-search');
  if (libSearch) libSearch.oninput = () => { state.ui.librarySearch = libSearch.value; refreshLibraryList(); };
  const importInput = document.getElementById('import-file-input');
  if (importInput) importInput.onchange = e => { handleImportFile(e.target.files[0]); e.target.value = ''; };
  attachSwipeHandlers();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;

  if (a === 'goto-tab') switchTab(t.dataset.tab);
  else if (a === 'cancel-pending') { cancelPendingUpload(); render(); }
  else if (a === 'skip-feed-item') { skipFeedItem(t.dataset.key); }
  else if (a === 'confirm-pending') {
    if (state.ui.pendingUpload && state.ui.pendingUpload.aiRead) finalizeUpload();
    else runProcessing(finalizeUpload);
  }
  else if (a === 'load-sample') {
    const idx = state.assignments.findIndex(a2 => a2.id === CALC_SAMPLE.id);
    if (idx !== -1) state.assignments.splice(idx, 1);
    state.assignments.unshift(JSON.parse(JSON.stringify(CALC_SAMPLE)));
    markActivity(); switchTab('feed');
  }
  else if (a === 'load-bio-sample') {
    const idx = state.assignments.findIndex(a2 => a2.id === BIO_SAMPLE.id);
    if (idx !== -1) state.assignments.splice(idx, 1);
    state.assignments.unshift(JSON.parse(JSON.stringify(BIO_SAMPLE)));
    markActivity(); switchTab('feed');
  }
  else if (a === 'load-essay-sample') {
    const idx = state.assignments.findIndex(a2 => a2.id === ESSAY_SAMPLE.id);
    if (idx !== -1) state.assignments.splice(idx, 1);
    state.assignments.unshift(JSON.parse(JSON.stringify(ESSAY_SAMPLE)));
    markActivity(); switchTab('feed');
  }
  else if (a === 'process-text') {
    const val = (state.ui.draftText || '').trim();
    if (!val) { toast('Paste some text first'); return; }
    state.ui.pendingUpload = { source: 'text', kind: 'text', title: `Pasted Set - ${new Date().toLocaleDateString()}`, subject: 'Other', dueDate: defaultDueDate(3), lines: parseLines(val) };
    render();
  }
  else if (a === 'open-assignment') { state.ui.workView = 'detail'; state.ui.workAssignmentId = t.dataset.ass; render(); }
  else if (a === 'library-subject') { state.ui.librarySubject = t.dataset.subject; render(); }
  else if (a === 'library-toggle-filter') { state.ui.libraryHideDone = !state.ui.libraryHideDone; render(); }
  else if (a === 'library-clear-search') { state.ui.librarySearch = ''; render(); }
  else if (a === 'library-reset') { state.ui.librarySearch = ''; state.ui.librarySubject = 'All'; state.ui.libraryHideDone = false; render(); }
  else if (a === 'ask-delete-assignment') { state.ui.confirmDeleteId = t.dataset.ass; render(); }
  else if (a === 'cancel-delete-assignment') { state.ui.confirmDeleteId = null; render(); }
  else if (a === 'confirm-delete-assignment') {
    const id = t.dataset.ass;
    const idx = state.assignments.findIndex(a2 => a2.id === id);
    if (idx !== -1) state.assignments.splice(idx, 1);
    state.ui.confirmDeleteId = null;
    if (state.ui.workAssignmentId === id) { state.ui.workView = 'list'; state.ui.workAssignmentId = null; }
    if (state.ui.workPlayer && state.ui.workPlayer.assignmentId === id) state.ui.workPlayer = null;
    if (state.ui.feedScope === id) state.ui.feedScope = 'mix';
    saveState();
    render();
    toast('Assignment removed');
  }
  else if (a === 'back-to-list') { state.ui.workView = 'list'; state.ui.workAssignmentId = null; render(); }
  else if (a === 'back-to-detail') { state.ui.workPlayer = null; render(); }
  else if (a === 'open-problem') {
    const ass = getAssignment(t.dataset.ass), p = getProblem(ass, t.dataset.prob);
    const firstIncomplete = p.steps.find(s => !s.completed) || p.steps[0];
    state.ui.workPlayer = { assignmentId: ass.id, problemId: p.id, stepId: firstIncomplete.id };
    render();
  }
  else if (a === 'start-sprint') {
    const ass = getAssignment(t.dataset.ass);
    const next = findNextStepInAssignment(ass, null);
    if (next) { state.ui.workPlayer = { assignmentId: ass.id, problemId: next.problemId, stepId: next.stepId }; render(); }
  }
  else if (a === 'export-assignment') openExportSheet(t.dataset.ass);
  else if (a === 'close-export') { document.getElementById('overlay-root').innerHTML = ''; }
  else if (a === 'copy-sheet') {
    const ass = getAssignment(t.dataset.ass);
    const text = buildSheetText(ass);
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard')).catch(() => toast('Copy failed  -  select text manually'));
  }
  else if (a === 'set-duedate') {} // handled by change event below

  else if (a === 'toggle-hint') { document.getElementById('hint-box')?.classList.toggle('hidden'); }
  else if (a === 'select-opt') {
    const key = `${t.dataset.ass}_${t.dataset.prob}_${t.dataset.step}`;
    state.ui.draftAnswers[key] = { index: Number(t.dataset.idx), checked: false };
    render();
  }
  else if (a === 'check-answer') {
    const key = `${t.dataset.ass}_${t.dataset.prob}_${t.dataset.step}`;
    const sel = state.ui.draftAnswers[key];
    if (!sel || sel.index === undefined) { toast('Pick an answer first'); return; }
    const ass = getAssignment(t.dataset.ass), p = getProblem(ass, t.dataset.prob), s = getStep(p, t.dataset.step);
    if (sel.index === s.correctIndex) {
      haptic(14);
      sel.checked = true; render();
      const result = completeHomeworkStep(t.dataset.ass, t.dataset.prob, t.dataset.step, sel.index);
      if (!result.problemComplete) {
        advanceWorkPlayerIfNeeded(t.dataset.ass);
        setTimeout(() => render(), 700);
      }
    } else {
      haptic([10, 40, 10]);
      sel.checked = true; render();
    }
  }
  else if (a === 'complete-free') {
    const key = `${t.dataset.ass}_${t.dataset.prob}_${t.dataset.step}`;
    const ass = getAssignment(t.dataset.ass), p = getProblem(ass, t.dataset.prob), s = getStep(p, t.dataset.step);
    s.response = state.ui.draftAnswers[key]?.text || '';
    if (t.dataset.grade) s.selfGrade = t.dataset.grade;
    const result = completeHomeworkStep(t.dataset.ass, t.dataset.prob, t.dataset.step);
    if (!result.problemComplete) advanceWorkPlayerIfNeeded(t.dataset.ass);
    render();
  }
  else if (a === 'save-transcription') {
    const key = `${t.dataset.ass}_${t.dataset.prob}_${t.dataset.step}`;
    const ass = getAssignment(t.dataset.ass), p = getProblem(ass, t.dataset.prob), s = getStep(p, t.dataset.step);
    const text = (state.ui.draftAnswers[key]?.text || '').trim();
    if (!text) { toast('Type the problem first'); return; }
    p.expr = escapeHtml(text);
    s.response = text;
    const result = completeHomeworkStep(t.dataset.ass, t.dataset.prob, t.dataset.step);
    if (!result.problemComplete) advanceWorkPlayerIfNeeded(t.dataset.ass);
    render();
  }
  else if (a === 'add-problem') {
    const ass = getAssignment(t.dataset.ass);
    ass.problems.push(newGenericProblem(ass.problems.length + 1));
    saveState(); render();
    toast('Problem added');
  }
  else if (a === 'reveal-answer-key') { state.ui.draftAnswers[t.dataset.key] = true; render(); }
  else if (a === 'close-overlay-continue') {
    document.getElementById('overlay-root').innerHTML = '';
    if (state.ui.workPlayer) {
      const ass = getAssignment(state.ui.workPlayer.assignmentId);
      const next = findNextStepInAssignment(ass, state.ui.workPlayer.problemId);
      if (next) state.ui.workPlayer = { assignmentId: ass.id, problemId: next.problemId, stepId: next.stepId };
      else { state.ui.workPlayer = null; state.ui.workView = 'detail'; }
    }
    render();
  }
  else if (a === 'close-overlay-export') {
    document.getElementById('overlay-root').innerHTML = '';
    state.ui.workPlayer = null; state.ui.workView = 'detail';
    render();
    openExportSheet(t.dataset.ass);
  }

  else if (a === 'open-exam') { state.studyExam = t.dataset.exam; saveState(); render(); }
  else if (a === 'back-to-exams') { state.studyExam = null; saveState(); render(); }
  else if (a === 'set-daily-goal') { setDailyGoal(Number(t.dataset.goal)); }
  else if (a === 'set-custom-goal') {
    const raw = document.getElementById('custom-goal-input')?.value;
    const n = Math.round(Number(raw));
    if (!raw || !isFinite(n) || n < GOAL_MIN) { toast(`Enter a number from ${GOAL_MIN} to ${GOAL_MAX}`); return; }
    setDailyGoal(n);
  }
  else if (a === 'set-session-size') {
    state.sessionSize = Math.max(5, Math.min(50, Number(t.dataset.size) || 10));
    saveState(); openSettingsSheet();
  }
  else if (a === 'start-deck') {
    const deck = getDeck(t.dataset.deck);
    startSession(buildDeckQueue(deck),
                 { kind: 'deck', deckId: deck.id, examKey: deck.exam, label: deck.title });
    render();
  }
  else if (a === 'start-mixed') {
    const examKey = t.dataset.exam || state.studyExam;
    const queue = buildMixedQueue(examKey);
    if (!queue.length) { toast('No cards available yet'); return; }
    startSession(queue, { kind: 'mixed', examKey, label: `${examKey} mix` });
    render();
  }
  else if (a === 'start-endless') {
    const examKey = t.dataset.exam || state.studyExam;
    const queue = buildMixedQueue(examKey, Math.max(5, sessionSize()));
    if (!queue.length) { toast('No cards available yet'); return; }
    startSession(queue, { kind: 'mixed', examKey, label: `${examKey} endless`, endless: true });
    render();
  }
  // Turns a finished set into an endless one from the summary, so "one more" never
  // means backing out and starting again.
  else if (a === 'continue-endless') {
    const meta = state.ui.studyMeta || {};
    if (!currentQueue().length) { toast('No cards available yet'); return; }
    state.ui.studyMeta = Object.assign({}, meta, {
      endless: true,
      label: meta.endless ? meta.label : `${meta.label || meta.examKey || 'Practice'} endless`,
    });
    state.ui.studyEnded = false;
    if (state.ui.studyCardIndex >= currentQueue().length && !extendSession()) {
      toast('No cards available yet'); return;
    }
    render();
  }
  else if (a === 'end-session') { state.ui.studyEnded = true; render(); }
  else if (a === 'retry-deck') {
    const deck = getDeck(t.dataset.deck);
    startSession(buildDeckQueue(deck),
                 { kind: 'deck', deckId: deck.id, examKey: deck.exam, label: deck.title });
    render();
  }
  else if (a === 'exit-deck') {
    state.ui.studyDeckId = null; state.ui.studyQueue = null; state.ui.studyMeta = null; state.ui.studyCardIndex = 0;
    state.ui.studyResults = []; state.ui.studyEnded = false;
    render();
  }
  else if (a === 'study-select') {
    const key = t.dataset.key || `study_${t.dataset.deck}_${t.dataset.card}`;
    // Once an answer is checked it stands. Letting a second tap re-open it meant a
    // card could be answered twice, counting twice towards the day's goal.
    if (state.ui.draftAnswers[key]?.checked) return;
    state.ui.draftAnswers[key] = { index: Number(t.dataset.idx), checked: false };
    render();
  }
  else if (a === 'study-check') {
    // Draft answers key on the instance; progress keys on the skill behind it.
    const key = t.dataset.key || `study_${t.dataset.deck}_${t.dataset.card}`;
    const skill = t.dataset.skill || t.dataset.card;
    const sel = state.ui.draftAnswers[key];
    if (!sel || sel.index === undefined) { toast('Pick an answer first'); return; }
    if (sel.checked) return;
    sel.checked = true;
    const card = queuedCard(t.dataset.deck, t.dataset.card, skill) || getDeck(t.dataset.deck)?.cards?.find(c => c.id === skill);
    haptic(sel.index === card?.correctIndex ? 14 : [10, 40, 10]);
    completeStudyCard(t.dataset.deck, skill, sel.index, t.dataset.card);
    render();
  }
  else if (a === 'study-session-next') { state.ui.studyCardIndex++; render(); }
  else if (a === 'study-free-done') {
    const key = t.dataset.key || `study_${t.dataset.deck}_${t.dataset.card}`;
    const draft = state.ui.draftAnswers[key] || (state.ui.draftAnswers[key] = {});
    if (draft.submitted) return;
    draft.submitted = true;
    completeFreeStudyCard(t.dataset.deck, t.dataset.skill || t.dataset.card, draft.text || '');
    render();
  }

  else if (a === 'share-sheet') shareSheet(t.dataset.ass);
  else if (a === 'open-settings') openSettingsSheet();
  else if (a === 'set-theme') setTheme(t.dataset.themeMode);
  else if (a === 'close-settings') { document.getElementById('overlay-root').innerHTML = ''; }
  else if (a === 'close-overlay-generic') { document.getElementById('overlay-root').innerHTML = ''; }
  // The streak card behind the overlay is now stale, so redraw on the way out.
  else if (a === 'close-streak-overlay') { document.getElementById('overlay-root').innerHTML = ''; render(); }
  else if (a === 'export-data') exportAllData();
  else if (a === 'trigger-import-data') document.getElementById('import-file-input')?.click();
  else if (a === 'ask-clear-data') { state.ui.confirmClearData = true; openSettingsSheet(); }
  else if (a === 'cancel-clear-data') { state.ui.confirmClearData = false; openSettingsSheet(); }
  else if (a === 'confirm-clear-data') clearAllData();

  else if (a === 'edit-problem') openEditProblemSheet(t.dataset.ass, t.dataset.prob);
  else if (a === 'save-problem-edit') {
    const val = document.getElementById('edit-problem-text').value.trim();
    const ass = getAssignment(t.dataset.ass), p = getProblem(ass, t.dataset.prob);
    p.expr = escapeHtml(val);
    document.getElementById('overlay-root').innerHTML = '';
    saveState(); render();
    toast('Problem updated');
  }
  else if (a === 'ask-delete-problem') openDeleteProblemConfirm(t.dataset.ass, t.dataset.prob);
  else if (a === 'confirm-delete-problem') {
    const ass = getAssignment(t.dataset.ass);
    const idx = ass.problems.findIndex(p => p.id === t.dataset.prob);
    if (idx !== -1) ass.problems.splice(idx, 1);
    ass.problems.forEach((p, i) => { p.index = i + 1; });
    document.getElementById('overlay-root').innerHTML = '';
    saveState(); render();
    toast('Problem removed');
  }
});

document.addEventListener('change', e => {
  const t = e.target.closest('[data-action="set-duedate"]');
  if (t) { const ass = getAssignment(t.dataset.ass); ass.dueDate = t.value; render(); return; }
  if (e.target.id === 'pu-subject' && state.ui.pendingUpload) { state.ui.pendingUpload.subject = e.target.value; }
  else if (e.target.id === 'pu-due' && state.ui.pendingUpload) { state.ui.pendingUpload.dueDate = e.target.value; }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-action="free-input"]') || e.target.matches('[data-action="study-free-input"]')) {
    const key = e.target.dataset.key;
    if (!state.ui.draftAnswers[key]) state.ui.draftAnswers[key] = {};
    state.ui.draftAnswers[key].text = e.target.value;
  } else if (e.target.id === 'pu-title') {
    if (state.ui.pendingUpload) state.ui.pendingUpload.title = e.target.value;
  } else if (e.target.id === 'pu-count') {
    if (state.ui.pendingUpload) state.ui.pendingUpload.count = Math.max(1, Number(e.target.value) || 1);
  } else if (e.target.id === 'pu-answerkey') {
    if (state.ui.pendingUpload) state.ui.pendingUpload.answerKeyText = e.target.value;
  } else if (e.target.id === 'pu-lines-text') {
    if (state.ui.pendingUpload) state.ui.pendingUpload.lines = parseLines(e.target.value);
  }
});

/* ============================== BOOT ============================== */
loadState();
refreshStreak();
applyTheme();
switchTab(state.ui.tab || 'study');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>

</body></html>
