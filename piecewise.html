<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        // Every colour resolves through a CSS variable holding RGB channels, so
        // the palette lives in exactly one place and dark mode is a re-declare.
        colors: {
          bg:       'rgb(var(--c-bg) / <alpha-value>)',
          surface:  'rgb(var(--c-surface) / <alpha-value>)',
          surface2: 'rgb(var(--c-surface2) / <alpha-value>)',
          line:     'rgb(var(--c-line) / <alpha-value>)',
          linesoft: 'rgb(var(--c-linesoft) / <alpha-value>)',
          ink:      'rgb(var(--c-ink) / <alpha-value>)',
          ink2:     'rgb(var(--c-ink2) / <alpha-value>)',
          ink3:     'rgb(var(--c-ink3) / <alpha-value>)',
          accent: {
             50:'rgb(var(--c-accent-50) / <alpha-value>)',  100:'rgb(var(--c-accent-100) / <alpha-value>)',
            400:'rgb(var(--c-accent-400) / <alpha-value>)', 500:'rgb(var(--c-accent-500) / <alpha-value>)',
            600:'rgb(var(--c-accent-600) / <alpha-value>)', 700:'rgb(var(--c-accent-700) / <alpha-value>)',
          },
          sky:   { 100:'rgb(var(--c-sky-100) / <alpha-value>)',   500:'rgb(var(--c-sky-500) / <alpha-value>)',   600:'rgb(var(--c-sky-600) / <alpha-value>)' },
          peach: { 100:'rgb(var(--c-peach-100) / <alpha-value>)', 500:'rgb(var(--c-peach-500) / <alpha-value>)', 600:'rgb(var(--c-peach-600) / <alpha-value>)' },
          good: 'rgb(var(--c-good) / <alpha-value>)',
          bad:  'rgb(var(--c-bad) / <alpha-value>)',
        },
        fontFamily: {
          display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          serifitalic: ['"Playfair Display"', 'Georgia', 'serif'],
        }
      }
    }
  }
</script>

<style>
  /* ========================================================================
     PIECEWISE THEME  -  "Clean. Calm. Focused."
     One pastel palette, declared once as RGB channels so every Tailwind
     colour, every inline style and the dark variant all read from it.
     ======================================================================== */
  :root {
    /* Core palette */
    --c-bg:        250 249 246;   /* #FAF9F6  page */
    --c-surface:   255 255 255;   /* #FFFFFF  cards */
    --c-surface2:  244 243 239;   /* #F4F3EF  insets, tracks */
    --c-line:      226 225 220;   /* #E2E1DC  borders */
    --c-linesoft:  237 236 231;   /* #EDECE7  hairline dividers */
    /* The grey ramp is set as light as WCAG AA allows rather than by eye  -  the
       reference's airy #9A9A9A lands at ~2.7:1 on this background, which is a
       lot of this app's text (dates, counts, captions) sitting under the line. */
    --c-ink:        47  47  47;   /* #2F2F2F  primary text   ~13.1:1 */
    --c-ink2:       88  88  86;   /* #585856  secondary text  ~6.8:1 */
    --c-ink3:      110 110 107;   /* #6E6E6B  tertiary text   ~4.8:1 */

    /* Primary  -  sage. Buttons and the progress ring. */
    --c-accent-50:  239 245 242;
    --c-accent-100: 214 229 222;
    --c-accent-400: 185 210 199;
    --c-accent-500: 167 196 184;  /* #A7C4B8 */
    --c-accent-600: 134 168 153;
    --c-accent-700: 103 136 122;
    --c-accent-800:  79 110  97;  /* #4F6E61  text-safe sage */

    /* Secondary  -  sky. Progress bars and highlights. */
    --c-sky-100: 226 237 248;
    --c-sky-500: 175 200 232;     /* #AFC8E8 */
    --c-sky-600: 143 176 216;
    --c-sky-700:  74 107 143;     /* #4A6B8F  text-safe sky */

    /* Accent  -  peach. Tags and highlights. */
    --c-peach-100: 253 238 227;
    --c-peach-500: 246 215 193;   /* #F6D7C1 */
    --c-peach-600: 232 184 148;
    --c-peach-700: 135  96  60;   /* #87603C  text-safe peach */

    /* Subject tints  -  the 700s are the text-safe shade of each 100 */
    --c-lilac-100: 237 231 245;  --c-lilac-700:  95  81 128;
    --c-rose-100:  250 230 236;  --c-rose-700:  138  78 100;

    --c-good: 127 169 143;  --c-good-ink:  79 122  95;
    --c-bad:  208 140 127;  --c-bad-ink:  176  89  74;
    /* Destructive buttons need a fill solid enough to carry a label at AA. */
    --c-danger: 176 89 74;  --c-danger-on: 255 255 255;

    /* Elevation  -  low, wide and soft. Nothing in this app should look heavy. */
    --shadow-card: 0 1px 2px rgb(47 47 47 / 0.04), 0 10px 24px -16px rgb(47 47 47 / 0.16);
    --shadow-lift: 0 1px 2px rgb(47 47 47 / 0.06), 0 18px 36px -22px rgb(47 47 47 / 0.26);
    --stage-grad: radial-gradient(120% 90% at 50% -10%, #F7F6F2 0%, #E9E8E3 70%);

    color-scheme: light;
  }

  /* Dark mode  -  the same pastels, floated on near-black instead of paper. */
  :root[data-theme="dark"] {
    --c-bg:         26  26  28;
    --c-surface:    36  36  38;
    --c-surface2:   45  45  48;
    --c-line:       56  56  60;
    --c-linesoft:   44  44  47;
    --c-ink:       242 241 236;
    --c-ink2:      175 174 169;
    --c-ink3:      150 148 143;

    --c-accent-50:  33  44  39;
    --c-accent-100: 44  58  52;
    --c-accent-400: 167 196 184;
    --c-accent-500: 167 196 184;
    --c-accent-600: 185 210 199;
    --c-accent-700: 185 210 199;
    --c-accent-800: 185 210 199;

    --c-sky-100:  34  48  61;
    --c-sky-500: 175 200 232;
    --c-sky-600: 196 216 240;
    --c-sky-700: 175 200 232;

    --c-peach-100: 58  47  38;
    --c-peach-500: 246 215 193;
    --c-peach-600: 246 215 193;
    --c-peach-700: 246 215 193;

    --c-lilac-100: 45  40  56;  --c-lilac-700: 198 184 223;
    --c-rose-100:  56  38  44;  --c-rose-700:  232 185 200;

    --c-good: 143 191 159;  --c-good-ink: 143 191 159;
    --c-bad:  224 156 143;  --c-bad-ink:  224 156 143;
    --c-danger: 224 156 143;  --c-danger-on: 42 20 16;

    --shadow-card: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 24px -16px rgb(0 0 0 / 0.6);
    --shadow-lift: 0 1px 2px rgb(0 0 0 / 0.35), 0 18px 36px -22px rgb(0 0 0 / 0.75);
    --stage-grad: radial-gradient(120% 90% at 50% -10%, #212123 0%, #141416 70%);

    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: rgb(var(--c-bg));
    color: rgb(var(--c-ink));
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--stage-grad);
    padding: 0;
  }
  .app-viewport {
    width: 100%;
    max-width: 448px;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 0;
    isolation: isolate;
    background: rgb(var(--c-bg));
  }
  @media (min-width: 640px) {
    .stage { padding: 24px; }
    .app-viewport {
      height: min(94dvh, 900px);
      border-radius: 32px;
      border: 1px solid rgb(var(--c-line));
      box-shadow: var(--shadow-lift);
    }
  }

  /* ------------------------------------------------------------------
     Shape: one generous radius scale, applied app-wide without having to
     touch every element's classes.
     ------------------------------------------------------------------ */
  .app-viewport [class*="rounded-2xl"]:not([class*="grad-btn"]) { border-radius: 22px !important; }
  .app-viewport [class*="rounded-xl"]:not([class*="rounded-2xl"]):not([class*="grad-btn"]) { border-radius: 18px !important; }
  .app-viewport [class*="rounded-lg"]:not([class*="rounded-xl"]):not([class*="rounded-2xl"]):not([class*="grad-btn"]) { border-radius: 14px !important; }
  .app-viewport [class*="rounded-md"]:not([class*="grad-btn"]) { border-radius: 10px !important; }

  /* ------------------------------------------------------------------
     Surfaces: white cards floating on warm off-white, hairline border,
     a shadow you feel rather than see.
     ------------------------------------------------------------------ */
  .app-viewport [class*="bg-surface"]:not([class*="bg-surface2"]) {
    background: rgb(var(--c-surface)) !important;
    box-shadow: var(--shadow-card);
  }
  .app-viewport [class*="bg-surface2"] {
    background: rgb(var(--c-surface2)) !important;
    box-shadow: none;
  }
  /* Borders sit a shade softer than the palette's divider grey so cards
     read as edges of paper, not boxes drawn on it. */
  .app-viewport [class*="border-line"] { border-color: rgb(var(--c-linesoft)) !important; }
  .app-viewport .bg-line, .app-viewport .h-px.bg-line { background: rgb(var(--c-linesoft)) !important; }

  /* Pastels are fills, not text colours  -  sage on white is only ~1.9:1.
     Where they carry text, swap in the deeper shade of the same hue so it
     clears WCAG AA; fills and borders keep the soft pastel. */
  .app-viewport [class*="text-accent-"] { color: rgb(var(--c-accent-800)) !important; }
  .app-viewport [class*="text-good"] { color: rgb(var(--c-good-ink)) !important; }
  .app-viewport [class*="text-bad"] { color: rgb(var(--c-bad-ink)) !important; }
  .app-viewport .bg-bad.text-white { background: rgb(var(--c-danger)) !important; color: rgb(var(--c-danger-on)) !important; }

  header.app-header { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  nav.app-nav { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }

  /* ------------------------------------------------------------------
     Type: calm and roomy. The reference has no uppercase tracking and no
     monospace  -  eyebrow labels are simply small, sentence-case greys.
     ------------------------------------------------------------------ */
  .app-viewport .uppercase {
    text-transform: none !important;
    letter-spacing: -0.004em !important;
    font-size: 11px !important;
    font-weight: 600 !important;
  }
  .app-viewport .font-mono {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  /* Screen titles read lighter and larger than stock Tailwind bold. */
  .app-viewport h2[class*="text-[22px]"] { font-size: 25px !important; font-weight: 600 !important; letter-spacing: -0.028em; }
  .app-viewport h2[class*="text-[17px]"] { font-size: 18px !important; font-weight: 600 !important; letter-spacing: -0.022em; }
  header.app-header h1 { font-size: 20px !important; font-weight: 600 !important; letter-spacing: -0.026em; }
  header.app-header h1 + p { font-size: 11px !important; color: rgb(var(--c-ink3)); }

  .math { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; letter-spacing: 0.01em; }
  .math sup, .math sub { font-style: italic; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; font-size: 0.82em; line-height: 1; }
  .frac .num { padding: 0 2px 2px; border-bottom: 1.3px solid currentColor; }
  .frac .den { padding: 2px 2px 0; }

  /* ------------------------------------------------------------------
     Buttons: soft sage pill. Text stays deep ink  -  white on #A7C4B8 is
     ~1.9:1, so the pastel carries the fill and the ink carries the label.
     ------------------------------------------------------------------ */
  .app-viewport [class*="grad-btn"] { border-radius: 999px !important; }
  .grad-btn {
    background: rgb(var(--c-accent-500)); color: #23312B; border-color: transparent !important;
    font-weight: 600 !important; letter-spacing: -0.006em;
    box-shadow: 0 1px 2px rgb(47 47 47 / 0.08), 0 8px 18px -10px rgb(103 136 122 / 0.5);
    transition: transform .1s cubic-bezier(.2,.8,.2,1), background .15s ease, box-shadow .15s ease;
  }
  .grad-btn:hover { background: rgb(var(--c-accent-400)); }
  .grad-btn:active { transform: scale(.97); background: rgb(var(--c-accent-600)); box-shadow: inset 0 1px 2px rgb(47 47 47 / 0.18); }
  .grad-text { color: rgb(var(--c-ink)); }
  .grad-ring { background: rgb(var(--c-accent-500)); }

  .option-btn { transition: border-color .15s ease, background .15s ease, transform .1s ease; }
  .option-btn:hover { border-color: rgb(var(--c-line)); }
  .option-btn:active { transform: scale(.99); }
  .option-btn.selected { background: rgb(var(--c-accent-50)) !important; border-color: rgb(var(--c-accent-500)) !important; }
  .option-btn.selected .bubble { background: rgb(var(--c-accent-500)) !important; color:#23312B !important; border-color: rgb(var(--c-accent-500)) !important; }
  .option-btn.correct { background: rgb(var(--c-accent-50)) !important; border-color: rgb(var(--c-good)) !important; }
  .option-btn.correct .bubble { background: rgb(var(--c-good)) !important; color:#1F2E24 !important; border-color: rgb(var(--c-good)) !important; }
  .option-btn.wrong { background: rgb(var(--c-bad) / 0.12) !important; border-color: rgb(var(--c-bad)) !important; animation: shake .32s; }
  .option-btn.wrong .bubble { background: rgb(var(--c-bad)) !important; color:#3A1C16 !important; border-color: rgb(var(--c-bad)) !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  @keyframes fadeUp { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }
  .enter { animation: fadeUp .18s ease-out; }
  @keyframes popIn { from { opacity:0; transform: scale(.98); } to { opacity:1; transform: scale(1); } }
  .pop { animation: popIn .2s cubic-bezier(.16,1,.3,1); }

  /* ------------------------------------------------------------------
     Progress: sage for the ring, sky for the bars  -  as in the reference.
     ------------------------------------------------------------------ */
  .ring-chart { transform: rotate(-90deg); }
  .ring-chart circle { transition: stroke-dashoffset .5s ease; }

  .app-viewport .rounded-full.overflow-hidden { background: rgb(var(--c-surface2)) !important; }
  .app-viewport .h-full.bg-accent-500 { background: rgb(var(--c-sky-500)) !important; border-radius: 999px; }
  .app-viewport .h-full.bg-good { background: rgb(var(--c-accent-500)) !important; border-radius: 999px; }

  progress-track { display:block; }

  .nav-btn { position: relative; transition: color .15s ease; }
  .nav-btn::after {
    content: ''; position: absolute; top: -2px; left: 50%; width: 4px; height: 4px; border-radius: 999px;
    background: rgb(var(--c-accent-500)); opacity: 0; transform: translate(-50%, 2px) scale(.5);
    transition: opacity .15s ease, transform .15s ease;
  }
  .nav-btn.text-ink::after { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* Section headings are plain in the reference  -  no rule, no diamond. */
  .section-rule { display: flex; align-items: center; gap: 8px; }

  /* Pastel subject tiles: soft square, generous radius, no border. */
  .subject-chip { border-radius: 14px; }

  /* Vertical numbered step tracker (assignment problem list) */
  .stepper { position: relative; }
  .stepper-line { position: absolute; left: 17px; top: 18px; bottom: 18px; width: 1px; background: rgb(var(--c-linesoft)); }
  .stepper-node {
    width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; shrink: 0; position: relative; z-index: 1; background: rgb(var(--c-bg));
  }
  .stepper-node.done { background: rgb(var(--c-accent-500)); color: #23312B; }
  .stepper-node.current { background: transparent; color: #23312B; }
  .stepper-node.current .ring2 { position:absolute; inset:0; border-radius:999px; background: rgb(var(--c-accent-500)); }
  .stepper-node.upcoming { border: 1.5px solid rgb(var(--c-line)); color: rgb(var(--c-ink3)); }

  @keyframes confettiPop {
    0% { transform: translate(0,0) rotate(0deg); opacity:1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }
  .confetti-piece { position: fixed; width:6px; height:11px; border-radius:1px; pointer-events:none; z-index:300; animation: confettiPop .9s ease-out forwards; }

  input[type="date"] { color-scheme: inherit; }
  textarea:focus, input:focus { outline: none; }
  ::placeholder { color: rgb(var(--c-ink3)); }
  select, input, textarea { color: rgb(var(--c-ink)); }
</style>

<div class="stage">
  <div class="app-viewport" id="app-viewport">

    <header class="app-header shrink-0 z-20">
      <div class="px-5 pb-3 bg-bg flex items-center justify-between">

              <path d="M32 36 L32 18 A18 18 0 0 1 49.7 32.9 Z" fill="rgb(var(--c-accent-500))" stroke="rgb(var(--c-accent-500))"/>

            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

function icon(name, cls) {

const SUBJECTS = ['Math', 'Science', 'English', 'History', 'Language', 'Other'];
function subjectIcon(subject) {
  const map = { Math: 'sigma', Calculus: 'sigma', Science: 'flask', English: 'bookOpen', History: 'landmark', Language: 'globe' };
  return map[subject] || 'sparkle';
}
// Soft pastel tints, one per subject. `tint` is the card/chip fill, `ink` the icon and
// label colour on top of it  -  a deeper shade of the same hue so it stays readable.
const SUBJECT_COLORS = {

  Calculus: { tint: 'rgb(var(--c-sky-100))',   ink: 'rgb(var(--c-sky-700))' },
  Science:  { tint: 'rgb(var(--c-accent-50))', ink: 'rgb(var(--c-accent-800))' },

const SUBJECT_FALLBACK = { tint: 'rgb(var(--c-surface2))', ink: 'rgb(var(--c-ink2))' };

function subjectColor(subject) { return subjectPalette(subject).ink; }
function subjectChipHTML(subject, size) {
  const { tint, ink } = subjectPalette(subject);
  const dim = size === 'sm' ? 'w-8 h-8' : size === 'lg' ? 'w-10 h-10' : 'w-9 h-9';

// Pocket-watch tick marks for the progress ring, drawn as short radial lines.
function ringTicksHTML(cx, cy, rOuter, rInner, count) {
  let out = '';
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 - Math.PI / 2;
    const x1 = cx + rInner * Math.cos(a), y1 = cy + rInner * Math.sin(a);
    const x2 = cx + rOuter * Math.cos(a), y2 = cy + rOuter * Math.sin(a);
    out += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
  }
  return out;
}

}

/* ============================== HELPERS ============================== */
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function frac(n, d) { return `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`; }
function uid(prefix) { return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`; }
function todayStr() { return new Date().toISOString().split('T')[0]; }
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function daysUntil(iso) {
  const due = new Date(iso + 'T23:59:59');
  const now = new Date();
  return Math.max(1, Math.ceil((due - now) / 86400000));
}

function burstConfetti() {
  return; // celebratory confetti removed for a calmer, professional feel
  // Confetti stays inside the pastel palette  -  sage, sky, peach, lilac, rose.
  const colors = ['#A7C4B8', '#AFC8E8', '#F6D7C1', '#C9BBE0', '#F2C2D0'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const dx = (Math.random() * 2 - 1) * 130;
    const dy = -(70 + Math.random() * 150);
    const rot = (Math.random() * 2 - 1) * 340;
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--dy', dy + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    const rect = document.getElementById('app-viewport').getBoundingClientRect();
    p.style.left = (rect.left + rect.width / 2 + (Math.random() * 80 - 40)) + 'px';
    p.style.top = (rect.top + rect.height * 0.62) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'pop';
  el.style.cssText = 'position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:rgb(var(--c-ink));color:rgb(var(--c-bg));font-family:Inter,sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;z-index:250;box-shadow:0 10px 26px -10px rgba(47,47,47,.5);white-space:nowrap;';
  el.textContent = msg;
  document.getElementById('app-viewport').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 1500);
}

// Light haptic feedback (Android Chrome supports navigator.vibrate; iOS Safari never has, so this
// is a harmless no-op there  -  feature-detected, never throws).
function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

    { id: 'c5', q: 'Solve: (x &minus; 3)(x + 5) = 0', options: ['x = 3 or x = &minus;5', 'x = &minus;3 or x = 5', 'x = 3 or x = 5', 'x = 0 only'], correctIndex: 0, explain: 'Set each factor to zero: x &minus; 3 = 0 or x + 5 = 0.' },
    { id: 'c6', q: 'If f(x) = 2x &minus; 5, what is f&#8315;&#185;(x)?', options: ['(x + 5) / 2', '(x &minus; 5) / 2', '2x + 5', '(x + 2) / 5'], correctIndex: 0, explain: 'Swap x and y then solve: x = 2y &minus; 5 &rarr; y = (x+5)/2.' },
    { id: 'c7', q: 'Simplify: (4x&#179;) / (2x)', options: ['2x&#178;', '2x&#179;', '4x&#178;', '8x&#178;'], correctIndex: 0, explain: 'Divide coefficients (4/2=2) and subtract exponents (3-1=2): 2x&#178;.' },
    { id: 'c8', q: 'Solve the system: 2x + y = 11, x &minus; y = 1. Find y.', options: ['y = 3', 'y = 1', 'y = 2', 'y = 4'], correctIndex: 0, explain: 'Substituting x = y + 1 into the first equation: 2(y+1) + y = 11, so 3y = 9, y = 3.' },
    { id: 'c9', q: 'Use the quadratic formula to solve x&#178; + 2x &minus; 8 = 0.', options: ['x = 2 or x = &minus;4', 'x = &minus;2 or x = 4', 'x = 8 or x = &minus;1', 'x = &minus;8 or x = 1'], correctIndex: 1, explain: 'This factors as (x+4)(x&minus;2) = 0, giving x = &minus;4 or x = 2.' },
    { id: 'c10', q: 'If f(x) = x&#178; and g(x) = x + 1, what is f(g(3))?', options: ['9', '12', '16', '25'], correctIndex: 2, explain: 'g(3) = 3 + 1 = 4, then f(4) = 4&#178; = 16.' },
    { id: 'c11', q: 'Solve |2x + 1| = 9.', options: ['x = &minus;4 or x = 5', 'x = 4 or x = 5', 'x = &minus;4 or x = &minus;5', 'x = 4 or x = &minus;5'], correctIndex: 3, explain: '2x + 1 = 9 gives x = 4; 2x + 1 = &minus;9 gives x = &minus;5.' },
    { id: 'c12', q: 'Simplify (x&#178; &minus; 9)/(x &minus; 3).', options: ['x + 3', 'x &minus; 3', 'x&#178; &minus; 3', 'x + 9'], correctIndex: 0, explain: 'x&#178; &minus; 9 factors as (x+3)(x&minus;3); the (x&minus;3) terms cancel, leaving x + 3.' },
    { id: 'c13', q: 'Find the distance between points (1, 1) and (4, 5).', options: ['4', '5', '6', '7'], correctIndex: 1, explain: 'Distance = &radic;((4&minus;1)&#178; + (5&minus;1)&#178;) = &radic;(9 + 16) = &radic;25 = 5.' },
    { id: 'c14', q: 'If 3 raised to the power x equals 81, what is x?', options: ['3', '5', '4', '6'], correctIndex: 2, explain: 'Since 3&#8308; = 81, x = 4.' },
    { id: 'c15', q: 'A piecewise function is defined as f(x) = x + 1 if x &lt; 2, and f(x) = 2x if x &ge; 2. What is f(2)?', options: ['3', '5', '6', '4'], correctIndex: 3, explain: 'Since 2 &ge; 2, use f(x) = 2x: f(2) = 2(2) = 4.' },
    { id: 'c16', q: 'y varies inversely with x. If y = 4 when x = 5, what is y when x = 10?', options: ['2', '1', '8', '10'], correctIndex: 0, explain: 'The constant is k = 4 &times; 5 = 20, so y = 20/10 = 2.' },
    { id: 'c17', q: 'Expand (x + 4)&#178;.', options: ['x&#178; + 16', 'x&#178; + 8x + 16', 'x&#178; + 4x + 16', 'x&#178; + 8x + 8'], correctIndex: 1, explain: '(x+4)&#178; = x&#178; + 2(4)x + 4&#178; = x&#178; + 8x + 16.' },
  ]},
  { id: 'gmat-quant', exam: 'GMAT', title: 'Quant Word Problems', cards: [
    { id: 'c1', q: 'A store marks up cost 40%, then discounts the marked price 25%. Net effect on the original cost?', options: ['5% increase', '15% decrease', 'No change', '10% increase'], correctIndex: 0, explain: '1.40 &times; 0.75 = 1.05 &mdash; a net 5% increase over the original cost.' },
    { id: 'c2', q: 'If 3 workers finish a job in 8 days at a constant rate, how many days for 4 workers?', options: ['6 days', '8 days', '10.7 days', '5 days'], correctIndex: 0, explain: 'Total work = 24 worker-days. 24 &divide; 4 workers = 6 days.' },
    { id: 'c3', q: 'Average of 5 numbers is 20. Removing one number drops the average of the remaining 4 to 18. What was removed?', options: ['28', '22', '18', '26'], correctIndex: 0, explain: '5&times;20 &minus; 4&times;18 = 100 &minus; 72 = 28.' },
    { id: 'c4', q: 'Ratio of boys to girls is 3:5 in a class of 40. How many girls?', options: ['25', '24', '15', '20'], correctIndex: 0, explain: '8 parts = 40, so 1 part = 5. Girls = 5 parts = 25.' },
    { id: 'c5', q: 'A car travels 240 miles in 4 hours. At the same rate, how long for 360 miles?', options: ['6 hours', '5 hours', '8 hours', '7.5 hours'], correctIndex: 0, explain: 'Rate = 60 mph. 360 / 60 = 6 hours.' },
    { id: 'c6', q: 'If x is 20% more than y, what percent of x is y (rounded)?', options: ['83.3%', '80%', '120%', '90%'], correctIndex: 0, explain: 'x = 1.2y, so y = x / 1.2 &asymp; 0.833x, about 83.3%.' },
    { id: 'c7', q: 'A mixture is 30% acid. How many liters of pure acid must be added to 10 liters of it to make a 50% acid mixture?', options: ['4 liters', '2 liters', '5 liters', '6 liters'], correctIndex: 0, explain: '(3 + x) / (10 + x) = 0.5 &rarr; 3 + x = 5 + 0.5x &rarr; x = 4.' },
    { id: 'c8', q: 'A sum of $2,000 is invested at 10% simple annual interest. What is the interest earned after 3 years?', options: ['$600', '$200', '$400', '$800'], correctIndex: 0, explain: 'Simple interest = Principal &times; rate &times; time = 2000 &times; 0.10 &times; 3 = $600.' },
    { id: 'c9', q: 'In how many ways can 3 distinct books be arranged on a shelf?', options: ['3', '6', '9', '12'], correctIndex: 1, explain: 'The number of arrangements of 3 distinct items is 3! = 3 &times; 2 &times; 1 = 6.' },
    { id: 'c10', q: 'Two trains start 300 miles apart and move toward each other at 50 mph and 70 mph. How long until they meet?', options: ['2 hours', '3 hours', '2.5 hours', '5 hours'], correctIndex: 2, explain: 'Their combined closing speed is 120 mph, so time = 300/120 = 2.5 hours.' },
    { id: 'c11', q: 'The sum of two consecutive integers is 45. What is the larger integer?', options: ['21', '22', '24', '23'], correctIndex: 3, explain: 'Let the integers be n and n+1: 2n + 1 = 45, so n = 22 and the larger is 23.' },
    { id: 'c12', q: 'A machine produces defective parts at a rate of 1 in 25. In a batch of 500 parts, about how many are defective?', options: ['20', '15', '25', '30'], correctIndex: 0, explain: '500 &divide; 25 = 20 expected defective parts.' },
    { id: 'c13', q: 'What is the greatest common divisor of 36 and 48?', options: ['6', '12', '8', '24'], correctIndex: 1, explain: 'The largest number dividing both 36 and 48 evenly is 12.' },
    { id: 'c14', q: 'A company\'s cost to produce an item is $40, and it sells for $55. What is the profit as a percent of cost?', options: ['27.5%', '40%', '37.5%', '55%'], correctIndex: 2, explain: 'Profit is $15 on a $40 cost: 15/40 = 0.375 = 37.5%.' },
    { id: 'c15', q: 'Simplify: (x&#8308;)(x&#178;) / x&#179;', options: ['x&#178;', 'x&#8308;', 'x&#8309;', 'x&#179;'], correctIndex: 3, explain: 'Add exponents in the numerator (4+2=6) then subtract the denominator\'s exponent (6&minus;3=3): x&#179;.' },
    { id: 'c16', q: 'In an arithmetic sequence, the first term is 5 and the common difference is 4. What is the 10th term?', options: ['41', '37', '45', '49'], correctIndex: 0, explain: 'The nth term is a&#8321; + (n&minus;1)d = 5 + 9(4) = 41.' },
    { id: 'c17', q: 'When a number is divided by 7, the remainder is 3. What is the remainder when twice that number is divided by 7?', options: ['3', '6', '1', '0'], correctIndex: 1, explain: 'If n = 7k + 3, then 2n = 14k + 6, and 6 is already less than 7, so the remainder is 6.' },
  ]},
  { id: 'gmat-verbal', exam: 'GMAT', title: 'Critical Reasoning', cards: [
    { id: 'c1', q: '"Sales rose after the ad campaign, so the campaign caused the rise." This argument\'s main weakness:', options: ['It confuses correlation with causation', 'It uses too much data', 'It is too specific', 'It lacks a conclusion'], correctIndex: 0, explain: 'Other factors could explain the sales increase &mdash; the argument assumes causation from mere correlation.' },
    { id: 'c2', q: 'Which best strengthens "This drug reduces headaches"?', options: ['A controlled trial showing fewer headaches vs. placebo', 'A testimonial from one patient', 'A larger marketing budget', 'A patent filing'], correctIndex: 0, explain: 'A controlled trial isolates the drug\'s effect from other variables &mdash; strong causal evidence.' },
    { id: 'c3', q: '"All successful CEOs have MBAs, so an MBA will make you a successful CEO." The flawed assumption:', options: ['That having an MBA is sufficient, not just common, among CEOs', 'That MBAs are expensive', 'That CEOs work hard', 'That correlation implies no relationship'], correctIndex: 0, explain: 'The argument treats a shared trait as a guarantee of success &mdash; a classic sufficiency error.' },
    { id: 'c4', q: '"Most successful startups have young founders, so youth causes startup success." The main flaw:', options: ['It treats a correlation as causation, ignoring other factors', 'It uses too small a sample', 'It contradicts itself', 'It lacks any evidence at all'], correctIndex: 0, explain: 'Founder age might just correlate with other success factors like risk tolerance or timing, not cause success.' },
    { id: 'c5', q: 'Which best weakens: "Company X\'s new ad campaign caused a 20% sales increase"?', options: ['Industry-wide sales rose 25% in the same period', 'The campaign used bright colors', 'The company hired a new CEO last year', 'Competitors also advertise'], correctIndex: 0, explain: 'If the whole industry grew even faster without the campaign, the campaign likely was not the cause.' },
    { id: 'c6', q: 'An argument based on a small, unrepresentative sample commits which flaw?', options: ['Hasty generalization', 'Circular reasoning', 'False dilemma', 'Appeal to authority'], correctIndex: 0, explain: 'Drawing a broad conclusion from too little (or biased) evidence is a hasty generalization.' },
    { id: 'c7', q: '"If the plan is approved, costs will fall. The plan was approved. Therefore costs will fall." This reasoning is:', options: ['A logical flaw called begging the question', 'A valid conditional argument (affirming the antecedent)', 'A hasty generalization', 'An ad hominem attack'], correctIndex: 1, explain: 'Affirming the antecedent of a true conditional is logically valid reasoning.' },
    { id: 'c8', q: 'Sales of umbrellas rise whenever sales of raincoats rise. Which best explains this without one causing the other?', options: ['Umbrella sales directly cause raincoat sales', 'Raincoat sales directly cause umbrella sales', 'Both increase because of rainy weather, a common cause', 'The two products are sold in different stores'], correctIndex: 2, explain: 'A third factor (rain) can drive both variables up together without either causing the other &mdash; a common cause.' },
    { id: 'c9', q: '"Either we raise taxes or the school will close." This argument commits which flaw if other options (like cutting other costs) exist?', options: ['A hasty generalization', 'An appeal to authority', 'A valid disjunction', 'A false dilemma'], correctIndex: 3, explain: 'Presenting only two options when more exist is a false dilemma.' },
    { id: 'c10', q: '"This policy is good because it is good for the economy, and we know it\'s good for the economy because the policy is good." This argument is:', options: ['Circular, since the conclusion is used to support itself', 'A strong analogy', 'A sampling-bias flaw', 'A valid deduction'], correctIndex: 0, explain: 'The argument\'s support and conclusion restate each other, which is circular reasoning.' },
    { id: 'c11', q: 'A survey of a company\'s own employees found 90% support the CEO. Which flaw does this best illustrate if used to claim "most people support the CEO"?', options: ['Appeal to emotion', 'Selection bias, since employees aren\'t a representative sample of "most people"', 'False dilemma', 'Equivocation'], correctIndex: 1, explain: 'Surveying only employees, who have an interest in supporting their employer, is not representative of the general population.' },
    { id: 'c12', q: 'Which question would be most useful to evaluate the argument "Exercise improves memory because athletes score higher on memory tests"?', options: ['What color jerseys the athletes wore', 'How many athletes were surveyed', 'Whether athletes differ from non-athletes in other ways that affect memory', 'Where the study was conducted'], correctIndex: 2, explain: 'Evaluating whether another factor (e.g. age, sleep, diet) explains the memory difference is key to testing the causal claim.' },
    { id: 'c13', q: 'A city\'s crime rate fell the same year a new mayor took office. Which best weakens the claim that the mayor\'s policies caused the drop?', options: ['The mayor was popular with voters', 'The mayor had served on the city council before', 'The city\'s population grew that year', 'Crime rates fell nationwide that year, including in cities with no policy change'], correctIndex: 3, explain: 'If crime fell everywhere regardless of local policy, the mayor\'s specific policies are less likely to be the cause.' },
    { id: 'c14', q: '"Everyone who disagrees with this policy simply doesn\'t understand economics." This statement is an example of:', options: ['Dismissing opposing views rather than addressing their substance', 'A strong statistical argument', 'A valid inference', 'An appeal to a credible authority'], correctIndex: 0, explain: 'The claim rejects all disagreement by assuming its own correctness rather than engaging with the actual arguments.' },
    { id: 'c15', q: 'A word used in two different senses within the same argument (e.g., "bank" meaning a riverbank in the premise but a financial bank in the conclusion) illustrates:', options: ['Circular reasoning', 'Equivocation', 'A false dilemma', 'A valid syllogism'], correctIndex: 1, explain: 'Equivocation occurs when a term shifts meaning between parts of an argument, making the logic invalid.' },
    { id: 'c16', q: 'A paradox/explain question asks you to find the choice that:', options: ['Restates the passage\'s conclusion', 'Weakens the argument\'s main claim', 'Resolves an apparent contradiction between two facts in the passage', 'Attacks the author directly'], correctIndex: 2, explain: '"Explain the discrepancy" questions require an answer that reconciles two facts that seem to conflict.' },
  ]},
  { id: 'gmat-data', exam: 'GMAT', title: 'Data Insights', cards: [
    { id: 'c1', q: 'Quarterly revenue ($k): Q1=100, Q2=120, Q3=90, Q4=150. What is the percent change from Q3 to Q4?', options: ['+66.7%', '+50%', '+60%', '+40%'], correctIndex: 0, explain: '(150 &minus; 90) / 90 = 0.667, a 66.7% increase.' },
    { id: 'c2', q: 'Source A (small sample) reports average age 34. Source B (much larger, representative sample) reports 31. For estimating the population average, you should generally:', options: ['Favor Source B, the larger representative sample', 'Favor Source A since it was reported first', 'Average the two equally', 'Discard both'], correctIndex: 0, explain: 'A larger, representative sample is generally more reliable for population estimates.' },
    { id: 'c3', q: 'A chart shows a correlation coefficient of r = 0.85 between study hours and test score. This indicates:', options: ['A strong positive linear relationship, not proof of causation', 'Studying causes higher scores', 'No meaningful relationship', 'A weak relationship'], correctIndex: 0, explain: 'r close to 1 signals a strong linear association only &mdash; causation needs more evidence.' },
    { id: 'c4', q: 'Data sufficiency: (1) x &gt; 0  (2) x&#178; = 16. Is x determined?', options: ['Only when both statements are used together', 'Statement 1 alone is sufficient', 'Statement 2 alone is sufficient', 'Neither is sufficient even together'], correctIndex: 0, explain: 'Statement 2 alone gives x = &plusmn;4; adding statement 1 narrows it to x = 4.' },
    { id: 'c5', q: 'A pie chart shows market share: A=40%, B=35%, C=25% of a $2,000,000 market. What is B\'s share in dollars?', options: ['$700,000', '$800,000', '$650,000', '$500,000'], correctIndex: 0, explain: '35% of $2,000,000 = 0.35 &times; 2,000,000 = $700,000.' },
    { id: 'c6', q: 'Two variables show a correlation coefficient of r = &minus;0.9. This means:', options: ['A strong negative linear relationship', 'A strong positive linear relationship', 'No relationship', 'A weak relationship'], correctIndex: 0, explain: 'r close to &minus;1 signals a strong linear relationship where one variable rises as the other falls.' },
    { id: 'c7', q: 'A box plot\'s median line sits closer to the bottom of the box than the top. This suggests the middle 50% of the data is:', options: ['Skewed toward lower values', 'Perfectly symmetric', 'Skewed toward higher values', 'Impossible to interpret'], correctIndex: 0, explain: 'A median pulled toward one edge of the box indicates the data bunches more on that side.' },
    { id: 'c8', q: 'Data sufficiency: (1) y = 2x  (2) x = 3. Is y determined?', options: ['Only when both statements are used together', 'Statement 1 alone is sufficient', 'Statement 2 alone is sufficient', 'Neither is sufficient even together'], correctIndex: 0, explain: 'Statement 1 alone leaves x unknown, and statement 2 alone doesn\'t relate x to y; together, y = 2(3) = 6.' },
    { id: 'c9', q: 'A Venn diagram shows 50 people like coffee, 40 like tea, and 20 like both. How many like at least one?', options: ['90', '70', '110', '50'], correctIndex: 1, explain: 'Total = coffee + tea &minus; both = 50 + 40 &minus; 20 = 70.' },
    { id: 'c10', q: 'A table shows quiz scores by class: Class A (10 students, avg 80), Class B (15 students, avg 90). What is the combined average?', options: ['85', '87', '86', '88'], correctIndex: 2, explain: 'Weighted average = (10&times;80 + 15&times;90) / 25 = 2150/25 = 86.' },
    { id: 'c11', q: 'A line graph shows monthly revenue rising steadily from January through June, then dropping sharply in July. The most likely reason to investigate first is:', options: ['An error in the January data', 'The company\'s founding date', 'The total number of months shown', 'A seasonal or one-time factor affecting July specifically'], correctIndex: 3, explain: 'A sudden break from an otherwise steady trend usually points to a specific event or seasonal effect in that period.' },
    { id: 'c12', q: 'Data set A has a standard deviation of 2; data set B (same mean) has a standard deviation of 8. Which statement is true?', options: ['Data set A\'s values cluster more tightly around the mean', 'Data set B\'s values cluster more tightly around the mean', 'Both data sets are identical', 'Standard deviation says nothing about spread'], correctIndex: 0, explain: 'A smaller standard deviation means the values are closer to the mean on average.' },
    { id: 'c13', q: 'Data sufficiency: (1) x &gt; 5  (2) x &lt; 10. Is x = 7?', options: ['Statement 1 alone is sufficient', 'Neither statement, even together, is sufficient to determine a single value of x', 'Statement 2 alone is sufficient', 'Both together are sufficient'], correctIndex: 1, explain: 'Many values between 5 and 10 satisfy both statements, so x is not pinned down to exactly 7.' },
    { id: 'c14', q: 'Two sources report different totals for the same quarter\'s sales: Source A says $4.2M, Source B (audited, official) says $4.5M. For a financial report, you should generally:', options: ['Average the two sources', 'Use Source A since it was reported first', 'Use Source B, the audited and official figure', 'Discard both sources'], correctIndex: 2, explain: 'An audited, official figure is more reliable than an unaudited or preliminary one.' },
    { id: 'c15', q: 'A bar chart shows four regions\' sales as percentages of a $500,000 total: North 20%, South 30%, East 25%, West 25%. What is South\'s sales in dollars?', options: ['$100,000', '$125,000', '$175,000', '$150,000'], correctIndex: 3, explain: '30% of $500,000 = 0.30 &times; 500,000 = $150,000.' },
    { id: 'c16', q: 'A scatterplot shows no clear pattern between shoe size and test scores (r &asymp; 0). This means:', options: ['There is little to no linear relationship between the variables', 'There is a strong positive relationship', 'There is a strong negative relationship', 'One variable causes the other'], correctIndex: 0, explain: 'An r value near 0 indicates essentially no linear association between the variables.' },
    { id: 'c17', q: 'A company\'s data table shows profit margin fell from 18% to 15% even though revenue grew. The most likely explanation to investigate is:', options: ['Revenue did not actually grow', 'Costs grew faster than revenue', 'Profit margin is unrelated to costs', 'The table contains no useful information'], correctIndex: 1, explain: 'If margin falls while revenue rises, costs must be eating up a larger share of that revenue.' },
  ]},
  { id: 'lsat-lr', exam: 'LSAT', title: 'Logical Reasoning', cards: [
    { id: 'c1', q: '"All lawyers are detail-oriented. Maria is detail-oriented. Therefore Maria is a lawyer." This is:', options: ['Affirming the consequent (a logical flaw)', 'A valid deduction', 'An appeal to authority', 'A sound syllogism'], correctIndex: 0, explain: 'Being detail-oriented doesn\'t make someone a lawyer &mdash; the argument reverses the original conditional.' },
    { id: 'c2', q: 'The contrapositive of "If it rains, the game is cancelled" is:', options: ['If the game is not cancelled, it did not rain', 'If it does not rain, the game is not cancelled', 'If the game is cancelled, it rained', 'If it rains, the game is not cancelled'], correctIndex: 0, explain: 'A contrapositive negates and swaps both parts: not-Q &rarr; not-P.' },
    { id: 'c3', q: '"The bridge is unsafe, so it should be closed. Closing it will prevent accidents." This assumes:', options: ['Closing the bridge actually removes the danger it poses', 'The bridge was recently built', 'No other bridges are unsafe', 'Accidents are common on bridges'], correctIndex: 0, explain: 'The argument leaps from "should close" to "will prevent accidents" without confirming closure removes the risk.' },
    { id: 'c4', q: 'A conditional rule "If X then Y" logically also requires:', options: ['If not Y, then not X (its contrapositive)', 'If Y then X', 'If not X then not Y', 'Nothing further'], correctIndex: 0, explain: 'Only the contrapositive is logically guaranteed to be true alongside the original conditional.' },
    { id: 'c5', q: '"Some cats are black. Some black things are heavy. Therefore some cats are heavy." This reasoning is:', options: ['Invalid &mdash; the middle term does not guarantee overlap', 'A valid deduction', 'Circular reasoning', 'An appeal to authority'], correctIndex: 0, explain: 'The "black" cats and "black" heavy things might not be the same black things &mdash; the link is not guaranteed.' },
    { id: 'c6', q: 'An argument that attacks the person making a claim rather than the claim itself commits:', options: ['An ad hominem fallacy', 'A straw man fallacy', 'A slippery slope', 'A false analogy'], correctIndex: 0, explain: 'Ad hominem means attacking the arguer instead of addressing the argument.' },
    { id: 'c7', q: '"If the alarm sounds, evacuate. The alarm did not sound. Therefore no one evacuated." This reasoning:', options: ['Denies the antecedent (a logical flaw)', 'Is a valid conditional argument', 'Affirms the consequent', 'Is a sound contrapositive'], correctIndex: 0, explain: 'Not-P does not logically guarantee not-Q; there could be other reasons to evacuate.' },
    { id: 'c8', q: '"If you study, you will pass" means studying is:', options: ['A necessary condition for passing', 'A sufficient condition for passing', 'Both necessary and sufficient for passing', 'Unrelated to passing'], correctIndex: 1, explain: 'In "If P then Q," P is sufficient to guarantee Q, though not necessarily required for it.' },
    { id: 'c9', q: '"You must submit the form to attend." This means submitting the form is:', options: ['A sufficient condition for attending', 'Irrelevant to attending', 'A necessary condition for attending', 'A contrapositive of attending'], correctIndex: 2, explain: '"Must" language establishes a necessary condition &mdash; without it, attending is impossible, though submitting alone may not guarantee attendance.' },
    { id: 'c10', q: '"The new policy will reduce traffic because it worked in a similar city." Which best weakens this argument?', options: ['The policy is popular with voters', 'The policy was announced recently', 'Traffic has always been a problem in this city', 'The similar city differs in a key way, such as population density, that affected the result'], correctIndex: 3, explain: 'If the comparison city differs in a relevant respect, the analogy supporting the argument breaks down.' },
    { id: 'c11', q: 'An argument uses a word to mean one thing in the premise and something different in the conclusion, without acknowledging the shift. This flaw is:', options: ['Equivocation', 'Circular reasoning', 'A false dilemma', 'A valid deduction'], correctIndex: 0, explain: 'Equivocation occurs when a term\'s meaning shifts between parts of an argument, undermining the logic.' },
    { id: 'c12', q: '"This law is just because it was passed by a legitimate government, and we know the government is legitimate because it only passes just laws." This argument is:', options: ['A sound deduction', 'Circular, since its support and conclusion depend on each other', 'An appeal to authority', 'A sufficient assumption'], correctIndex: 1, explain: 'The argument\'s premise and conclusion depend on each other, which is a circular structure.' },
    { id: 'c13', q: 'Parallel reasoning questions ask you to find an argument that:', options: ['Discusses the same subject matter', 'Reaches the same real-world conclusion', 'Shares the same logical structure as the original, regardless of topic', 'Uses the same specific words as the original'], correctIndex: 2, explain: 'Parallel reasoning matches the pattern of logic, not the subject matter or wording.' },
    { id: 'c14', q: 'To test whether an assumption is truly necessary for an argument, the "negation test" asks:', options: ['If the assumption were true, would the conclusion follow automatically?', 'Is the assumption popular with most people?', 'Is the assumption stated explicitly in the passage?', 'If the assumption were false, would the argument fall apart?'], correctIndex: 3, explain: 'If negating the assumption destroys the argument\'s support for its conclusion, the assumption is necessary.' },
    { id: 'c15', q: 'A "sufficient assumption" question asks you to find a statement that, if added to the premises, would:', options: ['Guarantee the conclusion follows logically', 'Merely make the conclusion more likely', 'Contradict one of the premises', 'Restate the conclusion word for word'], correctIndex: 0, explain: 'A sufficient assumption, combined with the stated premises, makes the conclusion logically certain.' },
    { id: 'c16', q: '"All members of the board approved the merger, so the merger must be a good decision." This argument mistakes a necessary condition for:', options: ['A contrapositive', 'A sufficient one, assuming agreement guarantees quality', 'An analogy', 'A causal mechanism'], correctIndex: 1, explain: 'Board approval may be required for the merger to proceed, but that alone does not guarantee it is a good decision.' },
    { id: 'c17', q: 'A "resolve the paradox" question requires an answer choice that:', options: ['Shows one of the facts is false', 'Weakens the stronger of the two facts', 'Explains how two seemingly conflicting facts can both be true', 'Restates both facts without explanation'], correctIndex: 2, explain: 'The correct answer reconciles the apparent conflict rather than denying either fact.' },
  ]},
  { id: 'lsat-rc', exam: 'LSAT', title: 'Reading Comprehension', cards: [
    { id: 'c1', q: 'A "primary purpose" question asks you to identify:', options: ["The author's main goal in writing the passage, not just one detail", 'The most surprising fact in the passage', 'The last sentence\'s topic', 'A minor example the author cites'], correctIndex: 0, explain: 'Primary purpose questions test whether you grasped the passage as a whole, not a single detail.' },

function loadState() {
  try {
    const saved = localStorage.getItem('piecewise_v2');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = Object.assign(state, parsed, { ui: state.ui });
    }
  } catch (e) {}
  if (!state.assignments || state.assignments.length === 0) {
    state.assignments = [JSON.parse(JSON.stringify(CALC_SAMPLE))];
  }
  if (!state.studyProgress) state.studyProgress = {};
}
function saveState() {
  try {
    const { ui, ...persist } = state;
    localStorage.setItem('piecewise_v2', JSON.stringify(persist));
  } catch (e) {}
  const el = document.getElementById('streak-counter');
  if (el) el.textContent = state.streakDays || 0;
}

function markActivity() {
  const today = todayStr();
  if (state.lastActiveDate === today) return;
  const yest = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  state.streakDays = (state.lastActiveDate === yest) ? (state.streakDays || 0) + 1 : 1;
  state.lastActiveDate = today;
}

/* ============================== STATS / SCHEDULER ============================== */
function getAssignmentStats(ass) {
  let total = 0, completed = 0, doneToday = 0;
  ass.problems.forEach(p => p.steps.forEach(s => {
    total++;
    if (s.completed) { completed++; if (s.completedAt === todayStr()) doneToday++; }
  }));
  return { total, completed, doneToday, remaining: total - completed };
}
function isProblemComplete(p) { return p.steps.every(s => s.completed); }
function isAssignmentComplete(ass) { return ass.problems.every(isProblemComplete); }

function countStudyDoneToday() {
  let n = 0;
  Object.values(state.studyProgress).forEach(deck => Object.values(deck).forEach(c => { if (c.completedAt === todayStr()) n++; }));
  return n;
}
function isCardDone(deckId, cardId) { return !!(state.studyProgress[deckId] && state.studyProgress[deckId][cardId]); }

function computeDailyPace(ass) {
  const stats = getAssignmentStats(ass);
  if (stats.remaining === 0) return 0;
  const daysLeft = daysUntil(ass.dueDate);
  return Math.max(1, Math.ceil(stats.remaining / daysLeft));
}

function scopedAssignments(scopeAssignmentId) {
  const pool = scopeAssignmentId ? state.assignments.filter(a => a.id === scopeAssignmentId) : state.assignments;
  return [...pool].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
}

// Builds the full remaining backlog, round-robined across assignments (soonest-due first each
// round) so the mix keeps flowing rather than stopping once today's small goal is hit.
function buildFeedQueue(scopeAssignmentId) {
  const lanes = scopedAssignments(scopeAssignmentId).map(ass => {
    const remaining = [];
    ass.problems.forEach(p => p.steps.forEach(s => { if (!s.completed) remaining.push({ type: 'homework', assignmentId: ass.id, problemId: p.id, stepId: s.id }); }));
    return remaining.length ? { remaining, batchSize: computeDailyPace(ass) } : null;
  }).filter(Boolean);

  const items = [];
  let progress = lanes.length > 0;
  while (progress) {
    progress = false;
    for (const lane of lanes) {
      if (lane.remaining.length === 0) continue;
      items.push(...lane.remaining.splice(0, lane.batchSize));
      if (lane.remaining.length > 0) progress = true;
    }
  }
  return items;
}

function todaysGoal(scopeAssignmentId) {
  return scopedAssignments(scopeAssignmentId).reduce((sum, ass) => sum + computeDailyPace(ass), 0);
}

function getAssignment(id) { return state.assignments.find(a => a.id === id); }
function getProblem(ass, id) { return ass.problems.find(p => p.id === id); }
function getStep(p, id) { return p.steps.find(s => s.id === id); }
function getDeck(id) { return STUDY_DECKS.find(d => d.id === id); }

function findNextStepInAssignment(ass, afterProblemId) {
  let passed = !afterProblemId;
  for (const p of ass.problems) {
    if (!passed) { if (p.id === afterProblemId) passed = true; continue; }
    for (const s of p.steps) if (!s.completed) return { problemId: p.id, stepId: s.id };
  }
  for (const p of ass.problems) for (const s of p.steps) if (!s.completed) return { problemId: p.id, stepId: s.id };
  return null;
}

function feedItemKey(item) {
  return `hw_${item.assignmentId}_${item.problemId}_${item.stepId}`;
}

function skipFeedItem(key) {
  if (!key) return;
  if (!state.ui.feedSkipped) state.ui.feedSkipped = [];
  if (!state.ui.feedSkipped.includes(key)) state.ui.feedSkipped.push(key);
  state.ui.feedFocusKey = null;
  const card = document.getElementById('step-card');
  if (card) {
    card.style.transition = 'transform .22s ease, opacity .22s ease';
    card.style.transform = 'translateX(-120%) rotate(-8deg)';
    card.style.opacity = '0';
    setTimeout(render, 190);
  } else {
    render();
  }
}

function attachSwipeHandlers() {
  const card = document.getElementById('step-card');
  if (!card || !card.dataset.feedKey) return;
  let startX = 0, dragging = false, dx = 0;
  const threshold = 90;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button, textarea, input, select, a')) return;
    dragging = true; startX = e.clientX; dx = 0;
    card.style.transition = 'none';
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  });
  card.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    card.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 260));
  });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform .22s ease, opacity .22s ease';
    if (Math.abs(dx) > threshold) {
      card.style.transform = `translateX(${dx > 0 ? 500 : -500}px) rotate(${dx / 10}deg)`;
      card.style.opacity = '0';
      const key = card.dataset.feedKey;
      setTimeout(() => skipFeedItem(key), 180);
    } else {
      card.style.transform = ''; card.style.opacity = '';
    }
  };
  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);
  card.addEventListener('pointerleave', () => { if (dragging && dx === 0) release(); });
}

function pickCurrentFeedItem(queue) {
  if (queue.length === 0) return null;
  const focused = queue.find(q => feedItemKey(q) === state.ui.feedFocusKey);
  if (focused) return focused;
  const skipped = state.ui.feedSkipped || [];
  return queue.find(q => !skipped.includes(feedItemKey(q))) || queue[0];
}

let uploadedImageData = null;
function defaultDueDate(daysFromNow) { return new Date(Date.now() + 86400000 * daysFromNow).toISOString().split('T')[0]; }
function parseLines(raw) {
  const lines = raw.split(/\n+/).map(l => l.trim()).filter(l => l.length > 2);
  return (lines.length ? lines : [raw.trim() || 'Untitled problem']).map(l => l.replace(/^\d+[\.\)]\s*/, ''));
}

// Worksheet furniture that shows up in extracted text but is never itself a problem.
function looksLikeWorksheetNoise(line) {
  const l = line.trim();
  if (l.length < 3) return true;
  return [
    /^name\s*:?\s*$/i, /^name\s*:/i, /^date\s*:/i, /^period\s*:/i, /^class(room)?\s*:/i,
    /^(teacher|score|grade|section)\s*:/i, /^page\s+\d+(\s*(of|\/)\s*\d+)?\s*$/i,
    /^instructions?\s*:?\s*$/i, /^directions?\s*:?\s*$/i,
    /^(show|write|circle|box|underline|label)\s+(all\s+)?your\s+(work|answer)/i,
    /^worksheet$/i, /^homework$/i, /^assignment$/i, /^answer\s+key$/i,
    /^\(?\d{1,4}\)?\.?\s*$/,             // a bare number (stray page number, or a leftover answer-blank marker)
    /^[_\-=.\s]{4,}$/,                   // a divider line of dashes/underscores/dots
    /^(https?:\/\/|www\.)\S+$/i,         // a standalone URL (worksheet-site watermark/footer)
  ].some(re => re.test(l));
}

// Matches a line that STARTS a new numbered/lettered problem: "1.", "1)", "(1)", "Q1.",
// "Problem 3:", "#4". Deliberately strict about the start of the line so it won't trigger
// mid-sentence on something like "...in 2. the answer is..." appearing after OCR noise.
const QUESTION_START_RE = /^\(?\s*(?:q(?:uestion)?\.?\s*|problem\.?\s*|#)?(\d{1,3})\s*[\.\):]\s*/i;

// Turns messy extracted document text (OCR output or a PDF's text layer) into a list of
// actual problems, instead of treating every line break as a new problem. Numbered markers
// define question boundaries; everything between one marker and the next  -  including lines
// that merely wrapped  -  is joined back into a single problem. Lines that are clearly page
// furniture (name/date fields, page numbers, "show your work") are dropped rather than turned
// into fake problems. If no numbering is found at all, falls back to blank-line-separated
// paragraphs, which is still far better than one-fake-problem-per-line.
// Breaks apart a single run-on chunk that actually contains several short problems with no
// line breaks or numbering between them  -  e.g. a list of equations ("x+3=2x -3x=-18 4x-3x=12")
// or several repeated sentences ("Evaluate the expression for x = 2. Evaluate ... for a = 5.").
// Cuts right after: (a) an ordinary sentence end (. ! ?) followed by a capital letter or digit,
// or (b) "= <plain number>" (a closed numeric answer)  -  but NOT when that number is actually
// the start of a coefficient like "2x" (checked via a lookahead so "= 2x" is never cut).
// Common abbreviations whose period is never a real sentence end  -  without this guard a
// run-on splitter applied to non-math subjects (history, language, reading) would wrongly
// cut after "Dr.", "U.S.", "e.g.", a single initial like "J.", etc.
const ABBREV_RE = /\b(mr|mrs|ms|dr|prof|st|jr|sr|vs|etc|e\.g|i\.e|a\.m|p\.m|vol|fig|eq|no|dept|ave|blvd|approx|[a-z])$/i;

function splitRunOnBlock(text) {
  const t = (text || '').trim();
  if (!t) return [];
  const BOUNDARY_RE = /=\s*-?\d+(?:\.\d+)?(?![a-zA-Z])\.?|[.!?]+(?=\s+[A-Z0-9])/g;
  const cuts = [];
  let m;
  while ((m = BOUNDARY_RE.exec(t))) {
    const end = m.index + m[0].length;
    const isEquationClose = m[0].includes('=');
    if (!isEquationClose) {
      const wordBefore = t.slice(0, m.index).match(/([A-Za-z]+)$/);
      if (wordBefore && ABBREV_RE.test(wordBefore[1])) continue; // looks like an abbreviation/initial, not a real sentence end
    }
    cuts.push(end);
  }
  if (!cuts.length) return [t];
  const parts = [];
  let start = 0;
  for (const c of cuts) {
    if (c > start) { parts.push(t.slice(start, c).trim()); start = c; }
  }
  if (start < t.length) parts.push(t.slice(start).trim());
  return parts.filter(p => p.length > 1);
}

// Applies splitRunOnBlock only to blocks that are suspiciously long for a single problem and
// contain more than one likely boundary  -  short, already-clean blocks are left untouched.
function refineLongBlocks(blocks) {
  const out = [];
  for (const b of blocks) {
    const boundaryCount = (b.match(/=\s*-?\d+(?:\.\d+)?(?![a-zA-Z])|[.!?]+\s+[A-Z0-9]/g) || []).length;
    if (b.length > 70 && boundaryCount > 1) out.push(...splitRunOnBlock(b));
    else out.push(b);
  }
  return out;
}

function parseExtractedDocument(raw) {
  const rawLines = (raw || '').split(/\r?\n/).map(l => l.trim());
  // If the document uses numbering anywhere, anything before the FIRST marker is a title,
  // name/date field, or instructions  -  never an actual problem  -  so it gets discarded
  // rather than becoming a fake "problem 0". Only keep pre-marker text when there is no
  // numbering anywhere, where it's genuine content for the paragraph fallback below.
  const hasNumbering = rawLines.some(l => l && !looksLikeWorksheetNoise(l) && QUESTION_START_RE.test(l));

  const blocks = [];
  let current = null;
  let sawNumbering = false;
  let emptyMarkerCount = 0;   // markers immediately followed by another marker (just answer-blank numbers)

  for (const line of rawLines) {
    if (!line || looksLikeWorksheetNoise(line)) continue;
    const m = line.match(QUESTION_START_RE);
    if (m) {
      sawNumbering = true;
      if (current !== null) {
        const trimmed = current.trim();
        if (trimmed) blocks.push(trimmed); else emptyMarkerCount++;
      }
      current = line.slice(m[0].length).trim();
    } else if (current !== null) {
      current = (current + ' ' + line).trim();   // a wrapped continuation of the current problem
    } else if (!hasNumbering) {
      current = line;                              // no numbering anywhere -> keep as candidate content
    }
    // else: numbering exists elsewhere but hasn't started yet -> this is header/title text, drop it
  }
  if (current) blocks.push(current.trim()); else if (current === '') emptyMarkerCount++;

  // A string of markers with nothing between them (1. 2. 3. 4. ...) is just a printed list of
  // blank answer lines, not real boundaries  -  if most of the markers we saw were empty like
  // that, the numbering for this document isn't trustworthy, so fall through to the paragraph
  // fallback below instead of trusting whatever got dumped after the last empty marker.
  const numberingIsDegenerate = emptyMarkerCount >= 3 && emptyMarkerCount > blocks.length;

  const cleanOnly = arr => {
    const out = arr.map(b => b.replace(/\s{2,}/g, ' ').trim()).filter(b => b.length > 1 && !looksLikeWorksheetNoise(b));
    return out.length ? out : null;
  };
  // Only used for the fallback paths below, where we have no reliable document numbering to
  // trust  -  never applied to a block that real numbering already bounded correctly, since
  // a naturally longer numbered problem (e.g. one spanning a small system of equations) must
  // not get chopped up just because it happens to contain more than one "=".
  const finalize = arr => cleanOnly(refineLongBlocks(arr));

  if (sawNumbering && !numberingIsDegenerate) {
    const result = cleanOnly(blocks);
    if (result) return result;
  }

  // No numbering detected (or it turned out to be degenerate)  -  fall back to paragraphs:
  // blank-line-separated chunks, each with its own wrapped lines joined into one problem.
  const paragraphs = (raw || '')
    .split(/\n\s*\n+/)
    .map(p => p.replace(/\s+/g, ' ').trim())
    .filter(p => p.length > 8 && !looksLikeWorksheetNoise(p));
  if (paragraphs.length > 1) {
    const result = finalize(paragraphs);
    if (result) return result;
  }

  // Truly just one undifferentiated blob of text (common when OCR loses all line structure)
  // -  still worth trying to split it into separate problems rather than giving up.
  const whole = (raw || '').replace(/\s+/g, ' ').trim();
  if (!whole) return ['Untitled problem'];
  return finalize([whole]) || ['Untitled problem'];
}

function newGenericProblem(index) {
  return {
    id: 'p' + index, index, expr: '',
    steps: [
      { id: 's0', kind: 'transcribe', title: 'Add the problem', question: `Copy problem ${index} from your worksheet, word for word.` },
      { id: 's1', kind: 'free', title: 'Work it out', question: 'Solve or draft your response here.' },
      { id: 's2', kind: 'free', title: 'Double-check', question: 'Review your work, then mark this step complete.' },
    ]
  };
}
function genericProblems(count) {
  const problems = [];
  for (let i = 1; i <= count; i++) problems.push(newGenericProblem(i));
  return problems;
}

function finalizeUpload() {
  const pu = state.ui.pendingUpload;
  if (!pu) return;
  const keyLines = (pu.answerKeyText || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
  const problems = pu.kind === 'text'
    ? pu.lines.map((line, idx) => ({
        id: 'p' + (idx + 1), index: idx + 1, expr: escapeHtml(line),
        steps: [{ id: 's1', kind: 'free', title: 'Work the problem', question: 'Show your work, then mark this step complete.' }]
      }))
    : genericProblems(pu.count);
  problems.forEach((p, idx) => { if (keyLines[idx]) p.answerKey = keyLines[idx]; });
  const newAss = { id: uid('doc'), title: (pu.title || 'Untitled Assignment').trim(), subject: pu.subject, dueDate: pu.dueDate, createdAt: new Date().toISOString(), problems };
  state.assignments.unshift(newAss);
  markActivity();
  state.ui.pendingUpload = null; uploadedImageData = null; state.ui.draftText = '';
  state.ui.workPlayer = null;
  state.ui.tab = 'work'; state.ui.workView = 'detail'; state.ui.workAssignmentId = newAss.id;
  switchTab('work');
}

function handleFileSelected(file) {
  if (!file) return;
  const titleGuess = file.name.replace(/\.[^.]+$/, '');
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (isImage) {
    const reader = new FileReader();
    reader.onload = evt => { uploadedImageData = evt.target.result; };
    reader.readAsDataURL(file);
    attemptAIRead(file, titleGuess, false);
  } else if (isPdf) {
    attemptAIRead(file, titleGuess, true);
  } else if (file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt')) {
    const reader = new FileReader();
    reader.onload = evt => {
      state.ui.pendingUpload = { source: 'file', kind: 'text', title: titleGuess, subject: 'Other', dueDate: defaultDueDate(3), lines: parseLines(evt.target.result) };
      render();
    };
    reader.readAsText(file);
  } else {
    fallbackToManualEntry(titleGuess, 'Other');
  }
}

function fallbackToManualEntry(titleGuess, subject, aiFailed) {
  state.ui.pendingUpload = { source: 'file', kind: 'generic', title: titleGuess, subject: subject || 'Math', dueDate: defaultDueDate(4), count: 5, aiFailed: !!aiFailed };
  render();
}

function ensurePdfWorker() {
  if (window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}

async function renderPdfPagesToBlobs(file, maxPages) {
  if (!window.pdfjsLib) throw new Error('pdf.js not available');
  ensurePdfWorker();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const numPages = Math.min(pdf.numPages, maxPages);
  const blobs = [];
  for (let i = 1; i <= numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.6 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (blob) blobs.push(blob);
  }
  return blobs;
}

// Pulls the real embedded text layer out of a PDF (no OCR needed) and reassembles
// rough line breaks by watching for jumps in each text run's baseline Y position.
async function extractPdfText(file, maxPages) {
  if (!window.pdfjsLib) throw new Error('pdf.js not available');
  ensurePdfWorker();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const numPages = Math.min(pdf.numPages, maxPages);
  let out = '';
  for (let i = 1; i <= numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lines = [], cur = [], lastY = null;
    content.items.forEach(item => {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2.5) { lines.push(cur.join(' ')); cur = []; }
      cur.push(item.str);
      lastY = y;
    });
    if (cur.length) lines.push(cur.join(' '));
    out += lines.join('\n') + '\n';
  }
  return out;
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (window.Tesseract) { resolve(); return; }
      existing.addEventListener('load', () => resolve());
      existing.addEventListener('error', () => reject(new Error('failed to load ' + src)));
      return;
    }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('failed to load ' + src));
    document.head.appendChild(s);
  });
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(img.src); resolve(img); };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// Grayscale + contrast-stretch (and upscale if small) before handing a photo to OCR.
// Phone photos of worksheets are usually low-contrast and unevenly lit, which is exactly
// what trips up Tesseract; this one pass measurably improves recognition on real photos.
// Local-adaptive ("Bradley") thresholding: each pixel is compared against the average
// brightness of its own neighborhood rather than one global cutoff, computed in O(1) per
// pixel via an integral image. This is the standard fix for what actually trips up OCR on a
// real phone photo  -  an uneven lighting gradient or a shadow across the page  -  which a
// single global contrast stretch cannot correct since one side of the page is genuinely
// brighter than the other.
function adaptiveThreshold(imageData, windowSize, t) {
  const { data, width, height } = imageData;
  const gray = new Float64Array(width * height);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  const iw = width + 1;
  const integral = new Float64Array(iw * (height + 1));
  for (let y = 0; y < height; y++) {
    let rowSum = 0;
    for (let x = 0; x < width; x++) {
      rowSum += gray[y * width + x];
      integral[(y + 1) * iw + (x + 1)] = integral[y * iw + (x + 1)] + rowSum;
    }
  }
  const s2 = windowSize >> 1;
  for (let y = 0; y < height; y++) {
    const y1 = Math.max(0, y - s2), y2 = Math.min(height - 1, y + s2);
    for (let x = 0; x < width; x++) {
      const x1 = Math.max(0, x - s2), x2 = Math.min(width - 1, x + s2);
      const count = (x2 - x1 + 1) * (y2 - y1 + 1);
      const sum = integral[(y2 + 1) * iw + (x2 + 1)] - integral[y1 * iw + (x2 + 1)] - integral[(y2 + 1) * iw + x1] + integral[y1 * iw + x1];
      const p = y * width + x;
      const value = gray[p] * count <= sum * (1 - t) ? 0 : 255;
      const di = p * 4;
      data[di] = data[di + 1] = data[di + 2] = value;
    }
  }
  return imageData;
}

async function preprocessImageForOCR(file) {
  const img = await loadImageFromFile(file);
  // Upscale small photos (helps OCR read small text) and cap huge ones (modern phone photos
  // can be 3000-4000px wide; OCR gains nothing past ~2200px and it just costs time/memory).
  let scale = 1;
  if (img.width < 1400) scale = Math.min(2.2, 1400 / img.width);
  else if (img.width > 2200) scale = 2200 / img.width;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const windowSize = Math.max(15, Math.round(canvas.width / 8));
  adaptiveThreshold(imageData, windowSize, 0.15);
  ctx.putImageData(imageData, 0, 0);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Client-side OCR via Tesseract.js  -  runs entirely in the browser, no server or API key needed.
// Uses the worker API (not the one-shot convenience call) so we can set a page-segmentation
// mode suited to a worksheet: a single column of variably-sized text blocks, read top to bottom.
const OCR_STATUS_LABELS = {
  'loading tesseract core': 'Starting the reader…',
  'initializing tesseract': 'Starting the reader…',
  'loading language traineddata': 'Downloading language data… (first time only)',
  'initializing api': 'Almost ready…',
  'recognizing text': 'Reading your worksheet…',
};

async function extractTextFromImage(file) {
  if (!window.Tesseract) {
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js');
  }
  updateReadingProgress(0.08, 'Cleaning up the photo…');
  let input = file;
  try { input = await preprocessImageForOCR(file); } catch (e) { /* fall back to the raw file if preprocessing fails */ }
  updateReadingProgress(0.18);

  const logger = m => {
    if (!m || typeof m.progress !== 'number') return;
    // Stages before "recognizing text" (model/language download, init) count for ~20% of the
    // bar; the actual OCR pass fills the rest, so the bar moves the whole time, not just at the end.
    const base = m.status === 'recognizing text' ? 0.2 : 0;
    const span = m.status === 'recognizing text' ? 0.8 : 0.2;
    updateReadingProgress(base + m.progress * span, OCR_STATUS_LABELS[m.status]);
  };

  if (window.Tesseract.createWorker) {
    const worker = await window.Tesseract.createWorker('eng', 1, { logger });
    try {
      // Default (fully-automatic) page segmentation. Worksheets commonly have a numbered
      // answer-blank column beside the actual problem text, which a forced single-column
      // mode would badly scramble  -  automatic layout detection handles that far better.
      const { data } = await worker.recognize(input);
      return (data && data.text) || '';
    } finally {
      await worker.terminate();
    }
  }
  const result = await window.Tesseract.recognize(input, 'eng', { logger });
  return (result && result.data && result.data.text) || '';
}

// Reads a worksheet file into a list of problem lines. If this page is running inside
// a Claude Artifact with image-sampling granted, that AI reader is tried first since it
// understands problem boundaries semantically. Everywhere else (a plain saved HTML file,
// any regular browser) it falls back to real local extraction: pdf.js's text layer for
// PDFs, and in-browser OCR (Tesseract.js) for photos/scans  -  fully offline-capable logic,
// no account or API key required.
async function attemptAIRead(file, titleGuess, isPdf) {
  showReadingOverlay();

  let sample = null;
  try { sample = window.claude ? await window.claude.use('sample') : null; } catch (e) {}
  if (sample) {
    let caps = null;
    try { caps = await sample.limits(); } catch (e) {}
    if (caps && caps.images) {
      try {
        const imageBlobs = isPdf ? await renderPdfPagesToBlobs(file, Math.max(1, Math.min(caps.images.maxCount, 5))) : [file];
        if (imageBlobs && imageBlobs.length) {
          const data = await sample.json(
            'This image shows a student worksheet or homework page (there may be several pages, given in order). ' +
            'Read every distinct problem or question exactly as written on it, including numbers, labels, and instructions, one per array item, in the order they appear. ' +
            'Skip headers, names, and page furniture that are not actual problems. ' +
            'Reply with ONLY a JSON array of strings, nothing else. Example: ["1) Solve for x: 2x + 5 = 17", "2) Simplify (x+3)(x-3)"]. If you cannot find any readable problems, reply with [].',
            { images: imageBlobs, modelTier: 'default', cache: false }
          );
          const lines = Array.isArray(data) ? data.map(x => String(x).trim()).filter(Boolean) : [];
          if (lines.length) {
            hideReadingOverlay();
            state.ui.pendingUpload = { source: 'file', kind: 'text', title: titleGuess, subject: 'Other', dueDate: defaultDueDate(4), lines, aiRead: true };
            render();
            return;
          }
        }
      } catch (e) { /* fall through to local extraction below */ }
    }
  }

  try {
    const rawText = isPdf ? await extractPdfText(file, 8) : await extractTextFromImage(file);
    hideReadingOverlay();
    const lines = parseExtractedDocument(rawText || '');
    if (!rawText || !rawText.trim() || lines.length === 0) {
      fallbackToManualEntry(titleGuess, isPdf ? 'Other' : 'Math', true);
      toast("Couldn't find readable text in that file  -  fill it in manually.");
      return;
    }
    state.ui.pendingUpload = { source: 'file', kind: 'text', title: titleGuess, subject: 'Other', dueDate: defaultDueDate(4), lines, aiRead: true };
    render();
  } catch (e) {
    hideReadingOverlay();
    fallbackToManualEntry(titleGuess, isPdf ? 'Other' : 'Math', true);
    toast("Couldn't read that automatically  -  fill it in manually.");
  }
}

function runProcessing(onDone) {
  const steps = ['Reading file', 'Identifying problems', 'Creating step-by-step plan', 'Finalizing'];
  let i = 0;
  const root = document.getElementById('overlay-root');
  function paint(pct) {
    root.innerHTML = `
      <div class="absolute inset-0 bg-ink/25 z-50 flex items-center justify-center p-5">
        <div class="bg-surface border border-line rounded-2xl p-6 w-full max-w-xs space-y-5 pop">

            <svg class="ring-chart w-14 h-14 absolute" viewBox="0 0 56 56">
                            <circle cx="28" cy="28" r="24" fill="none" stroke="rgb(var(--c-surface2))" stroke-width="4"/>
              <circle cx="28" cy="28" r="24" fill="none" stroke="rgb(var(--c-accent-500))" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="${2*Math.PI*24}" stroke-dashoffset="${2*Math.PI*24*(1-pct/100)}"/>
            </svg>
            ${icon('fileText','w-5 h-5 text-accent-500')}
          </div>
          <div class="text-center">
            <h3 class="text-sm font-semibold text-ink">Processing&hellip;</h3>
